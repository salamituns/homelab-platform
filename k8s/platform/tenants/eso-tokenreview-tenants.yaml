# Tenant ESO ServiceAccounts need system:auth-delegator so OpenBao can TokenReview
# their JWTs (disable_local_ca_jwt on the kubernetes auth mount). Platform SAs stay
# on ClusterRoleBinding/eso-tokenreview-belleshop. Add a subject here per new <app>-<env>.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-tokenreview-tenants
subjects:
  - kind: ServiceAccount
    name: eso
    namespace: demo-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
