# ExternalSecrets for the two oauth2-proxy instances (ADR 0016 decisions 6/8).
# OpenBao keys (written by `scripts/openbao-breakglass.sh root-run oidc oauth2-proxy-*`):
# client_id, client_secret, cookie_secret. Chart 10.7.1 env refs: client-id,
# client-secret, cookie-secret. SecretStore openbao-oidc / oidc-read already lists
# these two paths (verified in openbao-breakglass.sh). Prune=false: ESO owns the Secret.
# Merge ONLY after both OpenBao records exist: a missing Secret leaves the pod unscheduled
# (required keys, not optional) and the HTTPRoute already points at the proxy.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-prometheus
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-oidc
    kind: SecretStore
  target:
    name: oauth2-proxy-prometheus
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        client-id: '{{ .client_id }}'
        client-secret: '{{ .client_secret }}'
        # oauth2-proxy decodes only URL-safe base64; a standard-base64 secret (+ /) is taken as 44 raw bytes and
        # rejected ("must be 16, 24, or 32 bytes", live 2026-11-04). Converting is idempotent for URL-safe input.
        cookie-secret: '{{ .cookie_secret | replace "+" "-" | replace "/" "_" }}'
  data:
    - secretKey: client_id
      remoteRef:
        key: oidc/oauth2-proxy-prometheus
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: oidc/oauth2-proxy-prometheus
        property: client_secret
    - secretKey: cookie_secret
      remoteRef:
        key: oidc/oauth2-proxy-prometheus
        property: cookie_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-alertmanager
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-oidc
    kind: SecretStore
  target:
    name: oauth2-proxy-alertmanager
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        client-id: '{{ .client_id }}'
        client-secret: '{{ .client_secret }}'
        # oauth2-proxy decodes only URL-safe base64; a standard-base64 secret (+ /) is taken as 44 raw bytes and
        # rejected ("must be 16, 24, or 32 bytes", live 2026-11-04). Converting is idempotent for URL-safe input.
        cookie-secret: '{{ .cookie_secret | replace "+" "-" | replace "/" "_" }}'
  data:
    - secretKey: client_id
      remoteRef:
        key: oidc/oauth2-proxy-alertmanager
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: oidc/oauth2-proxy-alertmanager
        property: client_secret
    - secretKey: cookie_secret
      remoteRef:
        key: oidc/oauth2-proxy-alertmanager
        property: cookie_secret
