# Rendered Alertmanager route tree for `amtool check-config`. SMTP credentials are
# placeholders; the live Secret is templated by ESO from OpenBao
# (externalsecret-alertmanager-config.yaml). Keep this file's `route:` in lockstep
# with that template.
global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:465"
  smtp_from: "slo-check@example.invalid"
  smtp_auth_username: "slo-check@example.invalid"
  smtp_auth_password: "placeholder"
  smtp_require_tls: true
  smtp_force_implicit_tls: true
inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity =~ warning|info
    equal:
      - namespace
      - alertname
  - source_matchers:
      - severity = warning
    target_matchers:
      - severity = info
    equal:
      - namespace
      - alertname
  - source_matchers:
      - alertname = InfoInhibitor
    target_matchers:
      - severity = info
    equal:
      - namespace
  - target_matchers:
      - alertname = InfoInhibitor
route:
  group_by:
    - namespace
    - alertname
    - rule
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: "null"
  routes:
    - matchers:
        - alertname = "Watchdog"
      receiver: "null"
    - matchers:
        - alertname =~ "BelleShop.*"
      receiver: "email"
      group_by:
        - alertname
        - slo
        - window
      group_interval: 5m
      repeat_interval: 12h
    - matchers:
        - severity = "critical"
      receiver: "email"
    - matchers:
        - source = "falco"
      receiver: "email"
      group_by:
        - rule
        - k8s_ns_name
      repeat_interval: 24h
receivers:
  - name: "null"
  - name: "email"
    email_configs:
      - to: "slo-check@example.invalid"
        send_resolved: true
        require_tls: true
        force_implicit_tls: true
templates: []
