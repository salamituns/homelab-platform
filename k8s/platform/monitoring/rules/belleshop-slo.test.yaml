# promtool test rules. Rule file is extracted from the PrometheusRule CR (spec.groups).
# interval 1m so a 5-minute failure is five samples. Two series (shop-home, shop-api)
# because the SLI is the average of both SLO probes.
rule_files:
  - belleshop-slo.rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'probe_success{slo="belleshop-availability",probe="shop-home",job="blackbox"}'
        # 60m healthy, 6m hard fail, 10m recovered
        values: "1x59 0x5 1x10"
      - series: 'probe_success{slo="belleshop-availability",probe="shop-api",job="blackbox"}'
        values: "1x59 0x5 1x10"
      - series: 'probe_duration_seconds{slo="belleshop-availability",probe="shop-home",job="blackbox"}'
        values: "0.1x75"
      - series: 'probe_duration_seconds{slo="belleshop-availability",probe="shop-api",job="blackbox"}'
        values: "0.05x75"
    alert_rule_test:
      # After 60m of success, nothing pages.
      - eval_time: 60m
        alertname: BelleShopAvailabilityBurnFast
        exp_alerts: []
      # 2-minute blip at t=61-62 would be inside the 6m fail window; check the
      # dedicated blip test below. Here at t=65m we have 5m of 100% failure:
      # 5m window ≈ 1.0, 1h window ≈ 5/60 ≈ 0.083 > 0.072 → page.
      - eval_time: 65m
        alertname: BelleShopAvailabilityBurnFast
        exp_alerts:
          - exp_labels:
              alertname: BelleShopAvailabilityBurnFast
              severity: critical
              slo: belleshop-availability
              window: "1h"
            exp_annotations:
              summary: "BelleShop availability fast-burn (14.4× on 1h/5m)"
              description: "Availability error ratio is above 14.4× the 99.5%/30d budget on both the 1h and 5m windows (about 7.2% failed probes). The shop-home or shop-api probe through homelab-gateway is failing. See docs/runbooks/belleshop-slo.md."
              runbook_url: https://gitea.home.arpa/tunsgit/homelab-platform/src/branch/main/docs/runbooks/belleshop-slo.md
              dashboard_url: https://grafana.apps.home.arpa/d/belleshop-slo
      # Recovery: 10m of success after the fail. 5m window is healthy; alert clears.
      - eval_time: 76m
        alertname: BelleShopAvailabilityBurnFast
        exp_alerts: []

  - interval: 1m
    name: two-minute-blip-does-not-page
    input_series:
      - series: 'probe_success{slo="belleshop-availability",probe="shop-home",job="blackbox"}'
        values: "1x59 0x1 1x20"
      - series: 'probe_success{slo="belleshop-availability",probe="shop-api",job="blackbox"}'
        values: "1x59 0x1 1x20"
    alert_rule_test:
      # 2 minutes of 100% failure (samples at 60m and 61m). 5m window is hot
      # (~40%) but 1h window is 2/60 ≈ 3.3% < 7.2%, so the AND does not page.
      - eval_time: 62m
        alertname: BelleShopAvailabilityBurnFast
        exp_alerts: []
      - eval_time: 70m
        alertname: BelleShopAvailabilityBurnFast
        exp_alerts: []

  # Latency SLI must be a good-event RATIO (0..1), not an average of durations.
  # Live 2026-11-05 the rule used `duration < 0.5` (filter keeps the value) instead of
  # `< bool 0.5`, so it recorded ~0.17 with every probe fast and fired a false warning.
  - interval: 1m
    input_series:
      - series: 'probe_success{slo="belleshop-availability",probe="shop-home",job="blackbox"}'
        values: "1x30"
      - series: 'probe_success{slo="belleshop-availability",probe="shop-api",job="blackbox"}'
        values: "1x30"
      - series: 'probe_duration_seconds{slo="belleshop-availability",probe="shop-home",job="blackbox"}'
        values: "0.334x15 0.9x15"
      - series: 'probe_duration_seconds{slo="belleshop-availability",probe="shop-api",job="blackbox"}'
        values: "0.146x30"
    promql_expr_test:
      # all fast -> ratio exactly 1
      - expr: belleshop:latency_good:ratio5m
        eval_time: 10m
        exp_samples:
          - labels: 'belleshop:latency_good:ratio5m'
            value: 1
      # home slow (0.9s > 0.5s) for >5m, api fast -> half the probes good
      - expr: belleshop:latency_good:ratio5m
        eval_time: 25m
        exp_samples:
          - labels: 'belleshop:latency_good:ratio5m'
            value: 0.5
    alert_rule_test:
      - eval_time: 10m
        alertname: BelleShopLatencyBurnFast
        exp_alerts: []
      - eval_time: 10m
        alertname: BelleShopSloProbeAbsent
        exp_alerts: []

  # Drill 5 follow-up B: BelleShopSloProbeAbsent must stay silent when probes are
  # present or across a brief rollout/restart blip (1-2m), and fire (severity=critical)
  # once either or both SLO probe series have been absent for [2m] + for: 2m.
  - interval: 1m
    name: brief-blackbox-rollout-restart-does-not-fire-absent
    input_series:
      - series: 'probe_success{slo="belleshop-availability",probe="shop-home",job="blackbox"}'
        values: "1x10 _x2 1x10"
      - series: 'probe_success{slo="belleshop-availability",probe="shop-api",job="blackbox"}'
        values: "1x10 _x2 1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: BelleShopSloProbeAbsent
        exp_alerts: []
      - eval_time: 12m
        alertname: BelleShopSloProbeAbsent
        exp_alerts: []
      - eval_time: 15m
        alertname: BelleShopSloProbeAbsent
        exp_alerts: []

  - interval: 1m
    name: vanishing-slo-probes-fire-critical-after-2m-window-plus-2m-for
    input_series:
      - series: 'probe_success{slo="belleshop-availability",probe="shop-home",job="blackbox"}'
        values: "1x5"
      - series: 'probe_success{slo="belleshop-availability",probe="shop-api",job="blackbox"}'
        values: "1x5"
    alert_rule_test:
      # Present at t=5m -> silent.
      - eval_time: 5m
        alertname: BelleShopSloProbeAbsent
        exp_alerts: []
      # At t=7m, (5m, 7m] has 0 samples -> absent_over_time([2m]) enters Pending (for: 2m).
      - eval_time: 8m
        alertname: BelleShopSloProbeAbsent
        exp_alerts: []
      # At t=9m (4m after last sample at t=5m), for: 2m is satisfied -> both fire.
      - eval_time: 9m
        alertname: BelleShopSloProbeAbsent
        exp_alerts:
          - exp_labels:
              alertname: BelleShopSloProbeAbsent
              job: blackbox
              probe: shop-home
              severity: critical
              slo: belleshop-availability
              window: "2m"
            exp_annotations:
              summary: "SLO probes missing - shop availability is UNKNOWN"
              description: "No probe_success samples for shop-home (slo=belleshop-availability) over the last 2m (for 2m). Multi-window SLO burn rules evaluate to empty when probe series vanish, blinding availability paging (Drill 5 postmortem). Check kubectl get nodes first, then blackbox-exporter pods and Probe CRs. See docs/runbooks/belleshop-slo.md."
              runbook_url: https://gitea.home.arpa/tunsgit/homelab-platform/src/branch/main/docs/runbooks/belleshop-slo.md
              dashboard_url: https://grafana.apps.home.arpa/d/belleshop-slo
          - exp_labels:
              alertname: BelleShopSloProbeAbsent
              job: blackbox
              probe: shop-api
              severity: critical
              slo: belleshop-availability
              window: "2m"
            exp_annotations:
              summary: "SLO probes missing - shop availability is UNKNOWN"
              description: "No probe_success samples for shop-api (slo=belleshop-availability) over the last 2m (for 2m). Multi-window SLO burn rules evaluate to empty when probe series vanish, blinding availability paging (Drill 5 postmortem). Check kubectl get nodes first, then blackbox-exporter pods and Probe CRs. See docs/runbooks/belleshop-slo.md."
              runbook_url: https://gitea.home.arpa/tunsgit/homelab-platform/src/branch/main/docs/runbooks/belleshop-slo.md
              dashboard_url: https://grafana.apps.home.arpa/d/belleshop-slo

  - interval: 1m
    name: single-slo-probe-absent-fires-for-missing-probe-only
    input_series:
      - series: 'probe_success{slo="belleshop-availability",probe="shop-home",job="blackbox"}'
        values: "1x15"
      - series: 'probe_success{slo="belleshop-availability",probe="shop-api",job="blackbox"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: 9m
        alertname: BelleShopSloProbeAbsent
        exp_alerts:
          - exp_labels:
              alertname: BelleShopSloProbeAbsent
              job: blackbox
              probe: shop-api
              severity: critical
              slo: belleshop-availability
              window: "2m"
            exp_annotations:
              summary: "SLO probes missing - shop availability is UNKNOWN"
              description: "No probe_success samples for shop-api (slo=belleshop-availability) over the last 2m (for 2m). Multi-window SLO burn rules evaluate to empty when probe series vanish, blinding availability paging (Drill 5 postmortem). Check kubectl get nodes first, then blackbox-exporter pods and Probe CRs. See docs/runbooks/belleshop-slo.md."
              runbook_url: https://gitea.home.arpa/tunsgit/homelab-platform/src/branch/main/docs/runbooks/belleshop-slo.md
              dashboard_url: https://grafana.apps.home.arpa/d/belleshop-slo
