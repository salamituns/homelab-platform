# promtool test rules for govgraph tenant alerts. Rule file is extracted from the PrometheusRule CR.
rule_files:
  - govgraph.rules.yaml

evaluation_interval: 1m

tests:
  - name: healthy govgraph prod does not fire
    interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="govgraph-prod",code="200",job="govgraph-web"}'
        values: "0+1000x20"
      - series: 'http_requests_total{namespace="govgraph-prod",code="500",job="govgraph-web"}'
        values: "0+1x20"
      - series: 'kube_cronjob_status_last_successful_time{namespace="govgraph-prod",cronjob="govgraph-refresh"}'
        values: "1x20"
      - series: 'kube_deployment_status_replicas_available{namespace="govgraph-prod",deployment="web",job="kube-state-metrics"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: GovgraphProd5xxRatioHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: GovgraphRefreshStale
        exp_alerts: []
      - eval_time: 15m
        alertname: GovgraphProdUnavailable
        exp_alerts: []

  - name: missing series do not fire
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="personal-site-prod",deployment="personal-site",job="kube-state-metrics"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: GovgraphProd5xxRatioHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: GovgraphRefreshStale
        exp_alerts: []
      - eval_time: 15m
        alertname: GovgraphProdUnavailable
        exp_alerts: []

  - name: high 5xx ratio pages after 10m
    interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="govgraph-prod",code="200",job="govgraph-web"}'
        values: "0+100x20"
      - series: 'http_requests_total{namespace="govgraph-prod",code="500",job="govgraph-web"}'
        values: "0+20x20"
    alert_rule_test:
      - eval_time: 9m
        alertname: GovgraphProd5xxRatioHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: GovgraphProd5xxRatioHigh
        exp_alerts:
          - exp_labels:
              alertname: GovgraphProd5xxRatioHigh
              severity: critical
              tenant: govgraph
            exp_annotations:
              summary: "govgraph prod 5xx ratio is above 5%"
              description: "More than 5% of scraped HTTP requests in govgraph-prod are 5xx for 10m (value 0.16666666666666666). See docs/runbooks/govgraph.md."
              runbook_url: https://gitea.home.arpa/tunsgit/homelab-platform/src/branch/main/docs/runbooks/govgraph.md

  - name: refresh last success older than 26h pages after 15m
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="govgraph-prod",cronjob="govgraph-refresh"}'
        values: "0x1600"
    alert_rule_test:
      - eval_time: 25h
        alertname: GovgraphRefreshStale
        exp_alerts: []
      - eval_time: 26h16m
        alertname: GovgraphRefreshStale
        exp_alerts:
          - exp_labels:
              alertname: GovgraphRefreshStale
              severity: critical
              tenant: govgraph
              namespace: govgraph-prod
              cronjob: govgraph-refresh
            exp_annotations:
              summary: "govgraph-refresh last success is older than 26h"
              description: "CronJob govgraph-prod/govgraph-refresh last succeeded 94560 seconds ago (schedule 04:00 Africa/Lagos). See docs/runbooks/govgraph.md."
              runbook_url: https://gitea.home.arpa/tunsgit/homelab-platform/src/branch/main/docs/runbooks/govgraph.md

  - name: web pods not ready pages after 2m
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="govgraph-prod",deployment="web",job="kube-state-metrics"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: GovgraphProdUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: GovgraphProdUnavailable
        exp_alerts:
          - exp_labels:
              alertname: GovgraphProdUnavailable
              severity: critical
              tenant: govgraph
              namespace: govgraph-prod
              deployment: web
              job: kube-state-metrics
            exp_annotations:
              summary: "govgraph prod web Deployment has no available replicas"
              description: "govgraph-prod/web has 0 available replicas (want 1). apps-deploy must name the Deployment web. See docs/runbooks/govgraph.md."
              runbook_url: https://gitea.home.arpa/tunsgit/homelab-platform/src/branch/main/docs/runbooks/govgraph.md
