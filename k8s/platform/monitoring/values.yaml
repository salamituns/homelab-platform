# kube-prometheus-stack values (chart 88.3.0, release prometheus-stack). Taken from the live Helm release 2026-10-27.
# Grafana's admin login is the Secret monitoring/grafana-admin, created OUTSIDE git (ADR 0008).
# Alertmanager's config is the Secret monitoring/alertmanager-config-eso synced by ESO from
# OpenBao `secret/data/monitoring/alertmanager` (ADR 0015 section D, step 5).
# Grafana's OIDC login (Gitea provider, ADR 0016 step 1): client id/secret come from the
# ESO-synced Secret monitoring/grafana-oidc as OPTIONAL env vars - before the owner stores
# `secret/data/oidc/grafana` in OpenBao (scripts/openbao-breakglass.sh root-run oidc grafana),
# that Secret does not
# exist and Grafana starts with SSO broken while the local admin login keeps working.
# docs/runbooks/oidc-sso.md has the owner steps, proofs and rollback.
# kube-proxy/etcd/scheduler/controller-manager metrics bind 127.0.0.1 on this
# cluster (ss on the nodes, 2026-11-03), so the chart's ServiceMonitors scrape
# dead endpoints and fire etcdInsufficientMembers / TargetDown / *Unreachable
# forever. Disable the four scrapes and their default rules. The alternative
# (rebind those ports via kubeadm ExtraArgs, owner host change) is in
# docs/runbooks/monitoring.md.
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
  # KubeClientCertificateExpiration fires whenever ANY client presents a certificate that
  # expires within 24h (critical) / 7d (warning). The daily operator cert is 8h by design
  # (ADR 0014), so it fires permanently and would email critical every day once Alertmanager
  # email is live. The rule cannot be scoped to a user. Long-lived cluster certs are tracked
  # with `kubeadm certs check-expiration` instead (docs/runbooks/monitoring.md).
  disabled:
    KubeClientCertificateExpiration: true
alertmanager:
  alertmanagerSpec:
    configSecret: alertmanager-config-eso
    # WHY: with this set, alert emails link to https://alertmanager.apps.home.arpa (the
    # in-cluster default is unreachable from a browser). Root path, so the UI and API
    # stay at / (the chart derives routePrefix from the externalUrl path; "/" keeps the
    # "/" default - verified in the 88.3.0 chart render below and in monitoring.md).
    externalUrl: https://alertmanager.apps.home.arpa
    retention: 120h
    # Drill 5: one replica on wn1 meant no email while 107 was down. Two STS pods, each
    # with its own local-path PVC (volumeClaimTemplate ordinals -0 stays on wn1, -1 is new).
    # Operator enables gossip (--cluster.listen-address=:9094, --cluster.peer for both
    # ordinals) when replicas > 1; Prometheus kubernetes_sd of Service
    # prometheus-stack-kube-prom-alertmanager already lists every ready endpoint.
    replicas: 2
    podAntiAffinity: hard
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    # Live 2026-11-05: AM working set max 41 Mi / 24h, kubectl top 28 Mi. 200 Mi is the
    # operator default already on replica-0; keep it so Guaranteed-ish vs BestEffort.
    resources:
      requests:
        cpu: 25m
        memory: 200Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: local-path
  enabled: true
global:
  rbac:
    create: true
grafana:
  admin:
    existingSecret: grafana-admin
    passwordKey: admin-password
    userKey: admin-user
  # OIDC SSO via Gitea (ADR 0016 decisions 2/5/7/8/11). Endpoints are from the live
  # discovery doc https://gitea.home.arpa/.well-known/openid-configuration (2026-11-03).
  # GF_AUTH_GENERIC_OAUTH_* env vars override grafana.ini, so the id/secret never sit in git:
  # both are optional:true on purpose - a missing grafana-oidc Secret (before the owner stores
  # the OpenBao path) leaves SSO broken but Grafana running; the local admin login is unchanged.
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef:
        name: grafana-oidc
        key: client-id
        optional: true
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client-secret
        optional: true
  # The Gitea Caddy root as tls_client_ca (ADR 0016 decision 2): gitea.home.arpa is signed by
  # this root, NOT the lab root. Public certificate, so it is a ConfigMap, not a Secret.
  extraConfigmapMounts:
    - name: gitea-caddy-root
      configMap: gitea-caddy-root
      # Directory mount, no subPath: with subPath the FILE was mounted AT /etc/grafana/ca, so
      # /etc/grafana/ca/gitea-caddy-root.crt was 'not a directory' (live 2026-11-04 after #46).
      mountPath: /etc/grafana/ca
      readOnly: true
  grafana.ini:
    # Grafana builds its OAuth redirect_uri (and every absolute link) from root_url. Without it
    # the default is http://localhost:3000/, so Gitea rejects the login with a redirect
    # mismatch (seen live 2026-11-04 after PR #45). Must match the Gitea app's redirect URI.
    server:
      root_url: https://grafana.apps.home.arpa/
    auth.generic_oauth:
      name: Gitea
      enabled: true
      allow_sign_up: true
      scopes: "openid profile email groups"
      auth_url: https://gitea.home.arpa/login/oauth/authorize
      token_url: https://gitea.home.arpa/login/oauth/access_token
      api_url: https://gitea.home.arpa/login/oauth/userinfo
      use_pkce: true
      tls_client_ca: /etc/grafana/ca/gitea-caddy-root.crt
      # Grafana generic_oauth reads groups via a JMESPath in groups_attribute_path (an unknown key
      # like groups_claim_path is silently ignored -> no groups -> "not a member", live 2026-11-04).
      groups_attribute_path: groups
      # Space-separated ini list (ADR 0016 decision 5): only members of Gitea org `homelab`
      # may log in. Team names arrive lowercased in the groups claim (ADR 0016 decision 7).
      allowed_groups: homelab homelab:platform-admins
      # platform-admins -> Admin, org members -> Viewer, everyone else blocked above (ADR 0016 decision 7).
      role_attribute_path: "contains(groups[*], 'homelab:platform-admins') && 'Admin' || 'Viewer'"
  enabled: true
  # Drill 5 / BestEffort: Grafana had no requests. Live 2026-11-05: grafana working set
  # max 506 Mi / 24h (top 209 Mi), sidecars ~85 Mi each. Requests only — a memory limit
  # on the UI pod is optional later; eviction is the failure we are closing.
  resources:
    requests:
      cpu: 100m
      memory: 576Mi
  service:
    annotations: {}
    type: LoadBalancer
  sidecar:
    # Applies to every sidecar container (dashboard + datasource). Live max ~85 Mi each.
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      # kiwigrid default if unset; set explicitly so ConfigMap annotation grafana_folder=Homelab is honoured.
      folderAnnotation: grafana_folder
    datasources:
      defaultDatasourceEnabled: true
      enabled: true
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
# Subchart prometheus-node-exporter (chart 4.56.1 under kube-prometheus-stack 88.3.0).
# extraArgs is a list REPLACE: keep the chart's filesystem excludes (live on the
# DaemonSet 2026-11-07) and add the textfile collector. Host dir is created by the
# lynis Ansible role (and DirectoryOrCreate if the DS lands first). Same path is
# the hook for an etcd backup .prom from package 3 — do not rename it.
prometheus-node-exporter:
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.textfile.directory=/host/textfile
  extraHostVolumeMounts:
    - name: textfile
      hostPath: /var/lib/node_exporter/textfile
      mountPath: /host/textfile
      readOnly: true
      type: DirectoryOrCreate
      mountPropagation: HostToContainer
prometheus:
  enabled: true
  prometheusSpec:
    # WHY: with this set, alert emails link to https://prometheus.apps.home.arpa via
    # generatorURL instead of an in-cluster service URL no browser reaches. Root path,
    # so the UI and API stay at / (chart routePrefix derivation, same as alertmanager).
    externalUrl: https://prometheus.apps.home.arpa
    podMonitorSelectorNilUsesHelmValues: false
    retention: 7d
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    # Public-path blackbox jobs. Targets are file_sd from Secret
    # public-site-probe-targets (empty [] in git; ESO merges OpenBao URLs — one
    # file per public path, personal-site and govgraph alike).
    # Prometheus itself still has no internet egress — blackbox_exporter does
    # the GET (monitoring-blackbox-public-egress).
    secrets:
      - public-site-probe-targets
    additionalScrapeConfigs:
      - job_name: public-site-apex
        metrics_path: /probe
        scrape_interval: 30s
        scrape_timeout: 10s
        params:
          module: [http_2xx_public]
        file_sd_configs:
          - files:
              - /etc/prometheus/secrets/public-site-probe-targets/apex.json
            refresh_interval: 1m
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115
      - job_name: public-site-staging
        metrics_path: /probe
        scrape_interval: 30s
        scrape_timeout: 10s
        params:
          module: [http_302_public]
        file_sd_configs:
          - files:
              - /etc/prometheus/secrets/public-site-probe-targets/staging.json
            refresh_interval: 1m
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115
      # Govgraph public paths (Phase 2). Same file_sd Secret, separate files:
      # apex expects 200 (http_2xx_public), staging expects 302 (behind
      # Cloudflare Access, http_302_public). Govgraph serves no /metrics, so
      # probe_success is its request-health signal (govgraph-rules).
      - job_name: govgraph-apex
        metrics_path: /probe
        scrape_interval: 30s
        scrape_timeout: 10s
        params:
          module: [http_2xx_public]
        file_sd_configs:
          - files:
              - /etc/prometheus/secrets/public-site-probe-targets/govgraph-apex.json
            refresh_interval: 1m
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115
      - job_name: govgraph-staging
        metrics_path: /probe
        scrape_interval: 30s
        scrape_timeout: 10s
        params:
          module: [http_302_public]
        file_sd_configs:
          - files:
              - /etc/prometheus/secrets/public-site-probe-targets/govgraph-staging.json
            refresh_interval: 1m
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115
    # Drill 5: Prometheus was BestEffort (0 requests). Live 2026-11-05: working set max
    # 639 Mi / 24h, top 526 Mi, CPU max 213 m. Requests only. Do NOT set a memory limit:
    # compaction / WAL replay can spike RSS and a limit causes OOMKill loops that take
    # the detector with them. Scheduler fit is on workernode2 (see monitoring.md).
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: local-path
