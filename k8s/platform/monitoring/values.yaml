# kube-prometheus-stack values (chart 88.3.0, release prometheus-stack). Taken from the live Helm release 2026-10-27.
# Grafana's admin login is the Secret monitoring/grafana-admin, created OUTSIDE git (ADR 0008).
# kube-proxy/etcd/scheduler/controller-manager metrics bind 127.0.0.1 on this
# cluster (ss on the nodes, 2026-11-03), so the chart's ServiceMonitors scrape
# dead endpoints and fire etcdInsufficientMembers / TargetDown / *Unreachable
# forever. Disable the four scrapes and their default rules. The alternative
# (rebind those ports via kubeadm ExtraArgs, owner host change) is in
# docs/runbooks/monitoring.md.
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
alertmanager:
  alertmanagerSpec:
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: local-path
  enabled: true
global:
  rbac:
    create: true
grafana:
  admin:
    existingSecret: grafana-admin
    passwordKey: admin-password
    userKey: admin-user
  enabled: true
  service:
    annotations: {}
    type: LoadBalancer
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      defaultDatasourceEnabled: true
      enabled: true
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
prometheus:
  enabled: true
  prometheusSpec:
    podMonitorSelectorNilUsesHelmValues: false
    retention: 7d
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: local-path
