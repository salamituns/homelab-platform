# kube-prometheus-stack values (chart 88.3.0, release prometheus-stack). Taken from the live Helm release 2026-10-27.
# Grafana's admin login is the Secret monitoring/grafana-admin, created OUTSIDE git (ADR 0008).
# Alertmanager's config is the Secret monitoring/alertmanager-config-eso synced by ESO from
# OpenBao `secret/data/monitoring/alertmanager` (ADR 0015 section D, step 5).
# Grafana's OIDC login (Gitea provider, ADR 0016 step 1): client id/secret come from the
# ESO-synced Secret monitoring/grafana-oidc as OPTIONAL env vars - before the owner stores
# `secret/data/oidc/grafana` in OpenBao (scripts/openbao-breakglass.sh root-run oidc grafana),
# that Secret does not
# exist and Grafana starts with SSO broken while the local admin login keeps working.
# docs/runbooks/oidc-sso.md has the owner steps, proofs and rollback.
# kube-proxy/etcd/scheduler/controller-manager metrics bind 127.0.0.1 on this
# cluster (ss on the nodes, 2026-11-03), so the chart's ServiceMonitors scrape
# dead endpoints and fire etcdInsufficientMembers / TargetDown / *Unreachable
# forever. Disable the four scrapes and their default rules. The alternative
# (rebind those ports via kubeadm ExtraArgs, owner host change) is in
# docs/runbooks/monitoring.md.
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
  # KubeClientCertificateExpiration fires whenever ANY client presents a certificate that
  # expires within 24h (critical) / 7d (warning). The daily operator cert is 8h by design
  # (ADR 0014), so it fires permanently and would email critical every day once Alertmanager
  # email is live. The rule cannot be scoped to a user. Long-lived cluster certs are tracked
  # with `kubeadm certs check-expiration` instead (docs/runbooks/monitoring.md).
  disabled:
    KubeClientCertificateExpiration: true
alertmanager:
  alertmanagerSpec:
    configSecret: alertmanager-config-eso
    # WHY: with this set, alert emails link to https://alertmanager.apps.home.arpa (the
    # in-cluster default is unreachable from a browser). Root path, so the UI and API
    # stay at / (the chart derives routePrefix from the externalUrl path; "/" keeps the
    # "/" default - verified in the 88.3.0 chart render below and in monitoring.md).
    externalUrl: https://alertmanager.apps.home.arpa
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: local-path
  enabled: true
global:
  rbac:
    create: true
grafana:
  admin:
    existingSecret: grafana-admin
    passwordKey: admin-password
    userKey: admin-user
  # OIDC SSO via Gitea (ADR 0016 decisions 2/5/7/8/11). Endpoints are from the live
  # discovery doc https://gitea.home.arpa/.well-known/openid-configuration (2026-11-03).
  # GF_AUTH_GENERIC_OAUTH_* env vars override grafana.ini, so the id/secret never sit in git:
  # both are optional:true on purpose - a missing grafana-oidc Secret (before the owner stores
  # the OpenBao path) leaves SSO broken but Grafana running; the local admin login is unchanged.
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef:
        name: grafana-oidc
        key: client-id
        optional: true
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client-secret
        optional: true
  # The Gitea Caddy root as tls_client_ca (ADR 0016 decision 2): gitea.home.arpa is signed by
  # this root, NOT the lab root. Public certificate, so it is a ConfigMap, not a Secret.
  extraConfigmapMounts:
    - name: gitea-caddy-root
      configMap: gitea-caddy-root
      mountPath: /etc/grafana/ca
      subPath: gitea-caddy-root.crt
      readOnly: true
  grafana.ini:
    # Grafana builds its OAuth redirect_uri (and every absolute link) from root_url. Without it
    # the default is http://localhost:3000/, so Gitea rejects the login with a redirect
    # mismatch (seen live 2026-11-04 after PR #45). Must match the Gitea app's redirect URI.
    server:
      root_url: https://grafana.apps.home.arpa/
    auth.generic_oauth:
      name: Gitea
      enabled: true
      allow_sign_up: true
      scopes: "openid profile email groups"
      auth_url: https://gitea.home.arpa/login/oauth/authorize
      token_url: https://gitea.home.arpa/login/oauth/access_token
      api_url: https://gitea.home.arpa/login/oauth/userinfo
      use_pkce: true
      tls_client_ca: /etc/grafana/ca/gitea-caddy-root.crt
      groups_claim_path: groups
      # Space-separated ini list (ADR 0016 decision 5): only members of Gitea org `homelab`
      # may log in. Team names arrive lowercased in the groups claim (ADR 0016 decision 7).
      allowed_groups: homelab homelab:platform-admins
      # platform-admins -> Admin, org members -> Viewer, everyone else blocked above (ADR 0016 decision 7).
      role_attribute_path: "contains(groups[*], 'homelab:platform-admins') && 'Admin' || 'Viewer'"
  enabled: true
  service:
    annotations: {}
    type: LoadBalancer
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      defaultDatasourceEnabled: true
      enabled: true
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
prometheus:
  enabled: true
  prometheusSpec:
    # WHY: with this set, alert emails link to https://prometheus.apps.home.arpa via
    # generatorURL instead of an in-cluster service URL no browser reaches. Root path,
    # so the UI and API stay at / (chart routePrefix derivation, same as alertmanager).
    externalUrl: https://prometheus.apps.home.arpa
    podMonitorSelectorNilUsesHelmValues: false
    retention: 7d
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: local-path
