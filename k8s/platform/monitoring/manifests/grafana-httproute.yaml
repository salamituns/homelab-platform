# http://grafana.local through the shared Gateway (ADR 0013). Replaced grafana-ingress.yaml at the cutover.
# Managed by Argo CD (app monitoring, k8s/platform/apps/monitoring.yaml): change it in git.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab-gateway   # accepts routes only from labelled namespaces (gateway.yaml)
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - grafana.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""   # the API server's defaults, spelled out so a server-side apply shows no drift
          kind: Service
          name: prometheus-stack-grafana
          port: 80
