# https://grafana.apps.home.arpa through the shared Gateway (ADR 0013; renamed and moved to the
# https listener by ADR 0015 B). http:// now gets the grafana-redirect answer (302 to https).
# Replaced grafana-ingress.yaml at the cutover.
# Managed by Argo CD (app monitoring, k8s/platform/apps/monitoring.yaml): change it in git.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab-gateway   # accepts routes only from labelled namespaces (gateway.yaml)
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - grafana.apps.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-stack-grafana
          port: 80
