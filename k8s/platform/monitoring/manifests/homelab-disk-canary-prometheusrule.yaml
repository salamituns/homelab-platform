# Disk-fill canary eviction (ADR 0018 drill 4). Live 2026-11-04: kubelet_evictions
# is absent; kube_pod_status_reason{reason="Evicted"} exists (all zeros);
# kube_pod_container_status_last_terminated_reason exists (no Evicted series).
# kube_pod_labels is empty, so the matcher is the pod name prefix the drill
# manifest must use, not an app label join.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-disk-canary-rules
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  groups:
    - name: homelab.disk-canary
      rules:
        - alert: HomelabDiskCanaryEvicted
          expr: |
            kube_pod_status_reason{reason="Evicted", pod=~"homelab-disk-canary.*"} == 1
            or
            kube_pod_container_status_last_terminated_reason{reason="Evicted", pod=~"homelab-disk-canary.*"} == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Disk-fill canary pod was evicted"
            description: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} is Evicted (kube-state-metrics).
              This is the ADR 0018 drill-4 signal: emptyDir sizeLimit on the canary, not
              NodeFilesystemAlmostOutOfSpace. kubelet_evictions is not scraped on this
              cluster. See docs/runbooks/monitoring.md.
            runbook_url: https://gitea.home.arpa/tunsgit/homelab-platform/src/branch/main/docs/runbooks/monitoring.md
