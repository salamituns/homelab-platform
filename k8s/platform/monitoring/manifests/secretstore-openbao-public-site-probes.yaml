# Namespace-scoped SecretStore for the public-path probe URLs. Authenticates as
# monitoring/eso-public-site-probes against OpenBao role `public-site-probes`
# (written by scripts/openbao-breakglass.sh root-run public-site-probes).
# caBundle is the same sectools Caddy Local Authority 2026 ECC Root as the
# other monitoring SecretStores.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-public-site-probes
  namespace: monitoring
spec:
  provider:
    vault:
      server: https://bao.home.arpa
      path: secret
      version: v2
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: public-site-probes
          serviceAccountRef:
            name: eso-public-site-probes
