# The Gitea Caddy Local Authority 2026 ECC Root, from homelab-platform ansible/files/ca/
# gitea-caddy-root.crt (identical bytes; ADR 0015 section B keeps the vendored file the source
# of truth). Grafana uses it as `tls_client_ca` for the OIDC token/userinfo calls (ADR 0016
# decision 2): gitea.home.arpa is signed by THIS root, not the lab root - openssl verify with
# the lab root fails error 20 (verified 2026-11-03). A CA certificate is public material, so a
# ConfigMap is correct here, not a Secret. Mounted into grafana via
# `grafana.extraConfigmapMounts` in k8s/platform/monitoring/values.yaml at
# /etc/grafana/ca/gitea-caddy-root.crt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-caddy-root
  namespace: monitoring
data:
  gitea-caddy-root.crt: |
