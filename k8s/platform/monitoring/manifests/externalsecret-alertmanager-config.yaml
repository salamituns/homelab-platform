# ExternalSecret rendering the full Alertmanager configuration Secret (`alertmanager-config-eso`)
# from OpenBao `secret/data/monitoring/alertmanager` (ADR 0015 section D, step 5).
#
# Referenced by kube-prometheus-stack via `alertmanager.alertmanagerSpec.configSecret` in
# `k8s/platform/monitoring/values.yaml`.
# - `Prune=false` prevents Argo CD from pruning the ESO-managed Secret.
# - `smtp.gmail.com:465` uses implicit TLS (`smtp_force_implicit_tls: true`, `force_implicit_tls: true`);
#   outbound TCP 465 to public internet is allowed by `monitoring-alertmanager-egress` in
#   `k8s/platform/monitoring/manifests/netpol-allow.yaml`.
# - Routing:
#     * `alertname = "Watchdog"` -> `deadman` webhook (healthchecks.io ping URL from
#       OpenBao `watchdog_url`; never in git). group_wait 0s, group/repeat 1m so pings
#       land well inside healthchecks period 5 + grace 5. Missing `watchdog_url` makes
#       the *next* ESO sync fail; the last-good Secret (email) is kept. Owner writes
#       the URL with `root-run watchdog-url` BEFORE merging this template.
#     * `alertname =~ "BelleShop.*"` grouped by [alertname, slo, window], repeat_interval 12h
#       (ADR 0017). Only `severity=critical` children email; warnings (slow burn, latency)
#       stop here at `null` and are visible in the Alertmanager UI only (owner decision 1:
#       warnings do not page). Sits before the generic critical route so SLO pages keep the
#       SLO grouping.
#     * `severity = "critical"`  -> `email`
#     * `source = "falco"`       -> `email`, grouped by the falco labels `rule` + `k8s_ns_name`
#       (falcosidekick sends k8s_ns_name, NOT kubernetes `namespace`; read from a live alert
#       2026-11-03) with `repeat_interval: 24h` so a persisting detection pages at most once a
#       day. Before the falco exemption + this grouping, one noisy 24h window produced about
#       60 emails (every new event re-notified its group).
#     * default fallback         -> `null`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config-eso
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: alertmanager-config-eso
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
            smtp_smarthost: "smtp.gmail.com:465"
            smtp_from: '{{ .from }}'
            smtp_auth_username: '{{ .username }}'
            smtp_auth_password: '{{ .password }}'
            smtp_require_tls: true
            smtp_force_implicit_tls: true
          inhibit_rules:
            - source_matchers:
                - severity = critical
              target_matchers:
                - severity =~ warning|info
              equal:
                - namespace
                - alertname
            - source_matchers:
                - severity = warning
              target_matchers:
                - severity = info
              equal:
                - namespace
                - alertname
            - source_matchers:
                - alertname = InfoInhibitor
              target_matchers:
                - severity = info
              equal:
                - namespace
            - target_matchers:
                - alertname = InfoInhibitor
          route:
            group_by:
              - namespace
              - alertname
              - rule
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            receiver: "null"
            routes:
              - matchers:
                  - alertname = "Watchdog"
                receiver: "deadman"
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 1m
              - matchers:
                  - alertname =~ "BelleShop.*"
                receiver: "null"
                group_by:
                  - alertname
                  - slo
                  - window
                group_interval: 5m
                repeat_interval: 12h
                routes:
                  - matchers:
                      - severity = "critical"
                    receiver: "email"
              - matchers:
                  - severity = "critical"
                receiver: "email"
              - matchers:
                  - source = "falco"
                receiver: "email"
                # Falco-specific grouping: one notification per rule+namespace per day at most.
                # Label names are what falcosidekick actually sends (verified on a live alert
                # 2026-11-03; there is no `namespace` label, so the root group_by never grouped
                # falco alerts by where they came from). Sub-route group_by/repeat_interval
                # override the root values for this route only.
                group_by:
                  - rule
                  - k8s_ns_name
                repeat_interval: 24h
          receivers:
            - name: "null"
            - name: "deadman"
              webhook_configs:
                - url: '{{ .watchdog_url }}'
                  send_resolved: false
                  max_alerts: 1
            - name: "email"
              email_configs:
                - to: '{{ .to }}'
                  send_resolved: true
                  require_tls: true
                  force_implicit_tls: true
          templates:
            - /etc/alertmanager/config/*.tmpl
  data:
    - secretKey: username
      remoteRef:
        key: monitoring/alertmanager
        property: username
    - secretKey: password
      remoteRef:
        key: monitoring/alertmanager
        property: password
    - secretKey: from
      remoteRef:
        key: monitoring/alertmanager
        property: from
    - secretKey: to
      remoteRef:
        key: monitoring/alertmanager
        property: to
    - secretKey: watchdog_url
      remoteRef:
        key: monitoring/alertmanager
        property: watchdog_url
