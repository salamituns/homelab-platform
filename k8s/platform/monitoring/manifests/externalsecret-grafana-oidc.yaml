# ExternalSecret syncing Grafana's OIDC client id + secret from OpenBao
# `secret/data/oidc/grafana` (ADR 0016 decisions 5/8) into the Secret monitoring/grafana-oidc.
# The owner stores the values after creating the OAuth2 app in the Gitea UI, with
# scripts/openbao-setup-oidc.sh grafana (runbook: docs/runbooks/oidc-sso.md).
# - grafana reads them as GF_AUTH_GENERIC_OAUTH_CLIENT_ID / GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
#   via `grafana.envValueFrom` with `optional: true`, so until this Secret first syncs,
#   Grafana runs with SSO broken and the local admin login working - merging before the
#   owner stores the secret does NOT break Grafana.
# - `Prune=false` prevents Argo CD from pruning the ESO-managed Secret (same pattern as
#   alertmanager-config-eso).
# - ESO will report this ExternalSecret as unready (and log permission errors) while
#   `secret/data/oidc/grafana` does not exist in OpenBao yet; that is the expected state
#   between this merge and the owner's setup run.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-oidc
    kind: SecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        client-id: '{{ .client_id }}'
        client-secret: '{{ .client_secret }}'
  data:
    - secretKey: client_id
      remoteRef:
        key: oidc/grafana
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: oidc/grafana
        property: client_secret
