# Namespace-scoped SecretStore for the OIDC client secrets (ADR 0016 decisions 5/8), separate
# from SecretStore/openbao so the two OpenBao roles stay per-path least-privilege: this one
# authenticates as monitoring/eso-oidc against OpenBao's `oidc` role, which carries the
# `oidc-read` policy (read-only on the ESO-consumed secret/data/oidc/* paths, written by
# scripts/openbao-setup-oidc.sh). Consumers today: ExternalSecret grafana-oidc; the two
# oauth2-proxy instances of ADR 0016 step 3 will reuse this store.
# caBundle is the sectools Caddy Local Authority 2026 ECC Root certificate from
# homelab-platform ansible/files/ca/sectools-caddy-root.crt (same root CA as the other stores;
# verified byte-identical when this file was written).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-oidc
  namespace: monitoring
spec:
  provider:
    vault:
      server: https://bao.home.arpa
      path: secret
      version: v2
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: oidc
          serviceAccountRef:
            name: eso-oidc
