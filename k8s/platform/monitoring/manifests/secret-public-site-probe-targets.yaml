# Bootstrap file_sd for the public-path blackbox jobs. Empty arrays mean "no
# targets" so PublicSiteApexDown / PublicSiteStagingDown stay silent until
# OpenBao is filled (root-run public-site-probes) and ESO merges the URLs.
# Hostnames never belong in git (public mirror). Argo ignoreDifferences on
# /data (k8s/platform/apps/monitoring.yaml) so ESO can overwrite the files.
apiVersion: v1
kind: Secret
metadata:
  name: public-site-probe-targets
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  apex.json: "[]"
  staging.json: "[]"
