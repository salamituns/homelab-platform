# Merge OpenBao URLs into Secret/public-site-probe-targets as Prometheus file_sd
# JSON. Probe CRs cannot source targets from a Secret; putting hostnames in a
# Probe CR would land them in this public repo. file_sd on a mounted Secret is
# the same "value lives outside git" pattern as alertmanager watchdog_url.
# govgraph's two URLs live in the same KV object (keys govgraph_apex_url /
# govgraph_staging_url, written with `root-run -- bao kv patch ...`) so the
# dedicated SecretStore, SA and OpenBao role are reused; ESO renders all four
# files, so the owner must write the govgraph keys before/with the merge.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-site-probe-targets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-public-site-probes
    kind: SecretStore
  target:
    name: public-site-probe-targets
    creationPolicy: Merge
    deletionPolicy: Merge
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        apex.json: |
          [{"targets": [{{ .apex_url | toJson }}], "labels": {"probe": "apex"}}]
        staging.json: |
          [{"targets": [{{ .staging_url | toJson }}], "labels": {"probe": "staging"}}]
        govgraph-apex.json: |
          [{"targets": [{{ .govgraph_apex_url | toJson }}], "labels": {"probe": "govgraph-apex"}}]
        govgraph-staging.json: |
          [{"targets": [{{ .govgraph_staging_url | toJson }}], "labels": {"probe": "govgraph-staging"}}]
  data:
    - secretKey: apex_url
      remoteRef:
        key: monitoring/public-site-probes
        property: apex_url
    - secretKey: staging_url
      remoteRef:
        key: monitoring/public-site-probes
        property: staging_url
    - secretKey: govgraph_apex_url
      remoteRef:
        key: monitoring/public-site-probes
        property: govgraph_apex_url
    - secretKey: govgraph_staging_url
      remoteRef:
        key: monitoring/public-site-probes
        property: govgraph_staging_url
