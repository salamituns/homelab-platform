# Merge OpenBao URLs into Secret/public-site-probe-targets as Prometheus file_sd
# JSON. Probe CRs cannot source targets from a Secret; putting hostnames in a
# Probe CR would land them in this public repo. file_sd on a mounted Secret is
# the same "value lives outside git" pattern as alertmanager watchdog_url.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-site-probe-targets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-public-site-probes
    kind: SecretStore
  target:
    name: public-site-probe-targets
    creationPolicy: Merge
    deletionPolicy: Merge
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        apex.json: |
          [{"targets": [{{ .apex_url | toJson }}], "labels": {"probe": "apex"}}]
        staging.json: |
          [{"targets": [{{ .staging_url | toJson }}], "labels": {"probe": "staging"}}]
  data:
    - secretKey: apex_url
      remoteRef:
        key: monitoring/public-site-probes
        property: apex_url
    - secretKey: staging_url
      remoteRef:
        key: monitoring/public-site-probes
        property: staging_url
