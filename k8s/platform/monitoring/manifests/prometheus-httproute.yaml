# https://prometheus.apps.home.arpa through the shared Gateway (grafana route pattern, ADR 0015 B).
# WHY: alert emails link to Prometheus (generatorURL) and to the Alertmanager UI, and both
# previously pointed at in-cluster service URLs no browser can reach. The wildcard DNS record
# apps.home.arpa -> 192.168.1.240 already covers these hostnames (dns.yml internal_dns_wildcards),
# so no DNS change is needed. Pairs with the nginx-gateway data-plane egress to monitoring:9090
# and `monitoring-prometheus-ui-ingress` in netpol-allow.yaml.
# Managed by Argo CD (app monitoring, k8s/platform/apps/monitoring.yaml): change it in git.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab-gateway   # accepts routes only from labelled namespaces (gateway.yaml)
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - prometheus.apps.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-stack-kube-prom-prometheus
          port: 9090
