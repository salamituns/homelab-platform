# https://prometheus.apps.home.arpa through the shared Gateway.
# Backend is oauth2-proxy (ADR 0016 step 3), not prometheus-operated: the Gateway must not
# reach :9090 directly (netpol pair: nginx-gateway :4180 + monitoring-prometheus-ui-ingress
# from oauth2-proxy pods). Redirect route stays. Merge only after OpenBao
# `oidc/oauth2-proxy-prometheus` exists (runbook step 3).
# Managed by Argo CD (app monitoring, k8s/platform/apps/monitoring.yaml): change it in git.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - prometheus.apps.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oauth2-proxy-prometheus
          port: 80
