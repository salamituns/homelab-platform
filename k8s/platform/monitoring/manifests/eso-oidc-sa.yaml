# Dedicated identity for External Secrets Operator when reading the OIDC client secrets
# (ADR 0016 decisions 8/5) from OpenBao. Kept separate from eso-alertmanager so the OpenBao
# policies stay per-path: alertmanager-read covers only secret/data/monitoring/alertmanager,
# oidc-read (written by scripts/openbao-breakglass.sh `root-run oidc <consumer>`) covers only the ESO-consumed
# secret/data/oidc/* paths. Argo CD's client secret is NOT ESO-consumed (Argo CD is out-of-git,
# ADR 0008; the owner reads it from OpenBao over the admin SSH path), so no ESO identity ever
# gets read on secret/data/oidc/argocd.
# No workload Pod runs as this account: ESO's controller in namespace external-secrets requests
# a short-lived TokenRequest JWT for it when syncing SecretStore/openbao-oidc, and OpenBao's
# auth/kubernetes/role/oidc accepts ONLY monitoring/eso-oidc.
# Bound to system:auth-delegator in k8s/platform/cluster-config/eso-tokenreview.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-oidc
  namespace: monitoring
automountServiceAccountToken: false
