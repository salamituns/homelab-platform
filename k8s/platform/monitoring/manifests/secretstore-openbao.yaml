# Namespace-scoped SecretStore (not ClusterSecretStore) so namespace monitoring can only
# authenticate as monitoring/eso-alertmanager against OpenBao's `alertmanager` role, which
# carries the `alertmanager-read` policy (read-only on `secret/data/monitoring/alertmanager`).
# caBundle is the sectools Caddy Local Authority 2026 ECC Root certificate from
# homelab-platform ansible/files/ca/sectools-caddy-root.crt (same root CA as dev's SecretStore).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: monitoring
spec:
  provider:
    vault:
      server: https://bao.home.arpa
      path: secret
      version: v2
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: alertmanager
          serviceAccountRef:
            name: eso-alertmanager
