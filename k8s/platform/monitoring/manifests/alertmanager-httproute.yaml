# https://alertmanager.apps.home.arpa through the shared Gateway.
# Backend is oauth2-proxy (ADR 0016 step 3). The UI can create silences, so only
# homelab:platform-admins pass the proxy. Redirect route stays.
# Managed by Argo CD (app monitoring, k8s/platform/apps/monitoring.yaml): change it in git.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - alertmanager.apps.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oauth2-proxy-alertmanager
          port: 80
