# Week 8 Drill 3 short-lived leaf certificate (ADR 0018 owner override).
#
# Verified live against cert-manager-webhook (2026-11-04):
# - duration: 30m is rejected ("spec.duration: Invalid value: \"30m0s\":
#   certificate duration must be greater than 1h0m0s"). 1h is the minimum.
# - renewBefore: 20m renews at t+40m during PR A so the leaf stays valid while
#   HomelabTlsCertExpiringSoon / HomelabCertManagerCertExpiringSoon (for: 1h)
#   accumulate their 1-hour pending window.
# - dnsNames uses chaos-expiry.chaos-drill3.home.arpa (NOT .svc / .cluster.local):
#   both lab-root.crt and cert-manager/lab-ca-intermediate carry
#   "X509v3 Name Constraints: critical, Permitted: DNS:home.arpa". Go crypto/x509
#   (blackbox_exporter) and OpenSSL verify EVERY SAN on the leaf against
#   PermittedDNSDomains; including a .svc SAN causes TLS verification to fail at
#   t=0 ("DNS name \"chaos-expiry.chaos-drill3.svc\" is not permitted by any
#   constraint"), which suppresses probe_ssl_earliest_cert_expiry completely.
#   blackbox_exporter dials https://chaos-expiry.chaos-drill3.svc:8443/ via
#   cluster DNS and sets tls_config.server_name: chaos-expiry.chaos-drill3.home.arpa.
#
# PR B (week8-drill3-inject) patches ONLY spec.issuerRef.name to
# chaos-drill3-no-such-issuer so renewal fails and the 1h leaf expires.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: chaos-expiry
  namespace: chaos-drill3
spec:
  secretName: chaos-expiry-tls
  duration: 1h
  renewBefore: 20m
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - chaos-expiry.chaos-drill3.home.arpa
  issuerRef:
    name: chaos-drill3-no-such-issuer
    kind: ClusterIssuer
