# Tiny TLS server in chaos-drill3 for Week 8 Drill 3 (ADR 0018 owner override).
#
# Image note (live verification 2026-11-04):
# - Digest sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
#   was fetched through Nexus's dockerhub proxy on 192.168.1.87:8083
#   (nginxinc/nginx-unprivileged:stable-alpine, nginx 1.30.6-alpine, UID 101).
# - On nexus (.87), /etc/caddy/Caddyfile routes only /v2/library/* to :8083 and
#   /v2/aquasecurity/* to :8084; /v2/nginxinc/* falls through to the hosted
#   belleshop repo (:8082 -> HTTP 404), and Nexus requires basic auth
#   (Secret/nexus-pull only exists in dev and kyverno). Like the other platform
#   apps (loki, alloy, blackbox, oauth2-proxy, falco), chaos-drill3 pulls the
#   digest-pinned image directly so the app starts on merge with zero manual
#   host or secret changes.
#
# Volume mount note (w7-rules lesson 3):
# - Both /etc/nginx/tls (Secret chaos-expiry-tls) and /etc/nginx/chaos
#   (ConfigMap chaos-expiry-nginx) are mounted as directories WITHOUT subPath
#   so kubelet updates the symlinks when cert-manager renews chaos-expiry-tls.
# - A lightweight background loop reloads nginx every 300s (tty: false, so
#   Falco's "Terminal shell in container" rule — which requires proc.tty != 0 —
#   never triggers) so the renewed 1h certificate is served during PR A while
#   HomelabTlsCertExpiringSoon (for: 1h) accumulates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-expiry-nginx
  namespace: chaos-drill3
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;

    events {
      worker_connections 64;
    }

    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;
      access_log            off;

      server {
        listen 8443 ssl;
        server_name chaos-expiry.chaos-drill3.home.arpa chaos-expiry.chaos-drill3.svc;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location = / {
          default_type text/plain;
          return 200 "chaos\n";
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-expiry
  namespace: chaos-drill3
  labels:
    app: chaos-expiry
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: chaos-expiry
  template:
    metadata:
      labels:
        app: chaos-expiry
    spec:
      automountServiceAccountToken: false
      # workernode1 is at 97% memory limits (3722Mi/3816Mi); workernode2 is at
      # 93% (3552Mi/3816Mi, 264Mi headroom). Pin to workernode2.
      nodeSelector:
        kubernetes.io/hostname: workernode2
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        fsGroup: 10101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              (while sleep 300; do nginx -c /etc/nginx/chaos/nginx.conf -s reload >/dev/null 2>&1 || true; done) &
              exec nginx -c /etc/nginx/chaos/nginx.conf -g 'daemon off;'
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10101
            runAsGroup: 10101
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: config
              mountPath: /etc/nginx/chaos
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: chaos-expiry-tls
        - name: config
          configMap:
            name: chaos-expiry-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-expiry
  namespace: chaos-drill3
  labels:
    app: chaos-expiry
spec:
  type: ClusterIP
  selector:
    app: chaos-expiry
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
