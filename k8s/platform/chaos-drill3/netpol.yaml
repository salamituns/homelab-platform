# Default-deny + blackbox ingress allow for chaos-drill3 (Week 8 Drill 3).
#
# chaos-expiry makes zero outbound connections (no DNS, no API server), so
# Egress remains completely closed under chaos-drill3-default-deny. Same-node
# kubelet probes on :8443 are always accepted by kube-network-policies.
# Only blackbox_exporter pods in monitoring may connect to TCP 8443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: chaos-drill3-default-deny
  namespace: chaos-drill3
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chaos-drill3-allow-blackbox-ingress
  namespace: chaos-drill3
spec:
  podSelector:
    matchLabels:
      app: chaos-expiry
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-blackbox-exporter
      ports:
        - protocol: TCP
          port: 8443
