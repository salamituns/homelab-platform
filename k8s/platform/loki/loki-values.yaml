# grafana-community/loki 21.0.0 (app 3.7.9). Official grafana/loki 7.x is Grafana
# Enterprise Logs only (split 2026-03-16); this is the OSS successor of that chart
# (forked at 6.55.0). ADR 0017 decision 1: SingleBinary, filesystem, 10Gi, 7d.
# Chart 21.0.0 still accepts deploymentMode: SingleBinary (alias of Monolithic).
fullnameOverride: loki

deploymentMode: SingleBinary

loki:
  image:
    registry: docker.io
    repository: grafana/loki
    tag: "3.7.9"
    # Index digest (docker hub, 2026-11-04) so the amd64 worker pulls a pin, not a moving tag.
    digest: sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
  auth_enabled: false
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    allow_structured_metadata: true
    volume_enabled: true
  # Loki 3.x refuses to start with retention_enabled unless delete_request_store is set
  # (compactor config; verified with `loki -verify-config` against 3.7.9).
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false
  tracing:
    enabled: false
  pattern_ingester:
    enabled: false
  # Single replica: do not abort if memberlist has nobody else to join.
  extraMemberlistConfig:
    abort_if_cluster_join_fails: false
    advertise_port: 7946
    bind_port: 7946
    max_join_backoff: 1m
    max_join_retries: 10
    min_join_backoff: 1s
    rejoin_interval: 90s

singleBinary:
  replicas: 1
  sidecar: false
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path
    enableStatefulSetAutoDeletePVC: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Workers only: master's root has 16G free (ADR 0017). control-plane taint already
  # keeps it off master; this affinity is the belt if that taint is ever removed.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
memcached:
  enabled: false
rollout_operator:
  enabled: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
indexGateway:
  replicas: 0
ruler:
  enabled: false

monitoring:
  dashboards:
    enabled: false
  serviceMonitor:
    enabled: true
    interval: 30s
