# grafana/alloy 1.15.0 (app v1.21.3). DaemonSet on every node including master
# (ADR 0017 decision 1). Pod logs via the Kubernetes API, not hostPath.
# Owner decision 2: drop namespace kube-system.
fullnameOverride: alloy

crds:
  create: false

image:
  registry: docker.io
  repository: grafana/alloy
  tag: v1.21.3
  digest: sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4

alloy:
  enableReporting: false
  clustering:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  mounts:
    varlog: false
    dockercontainers: false
  configMap:
    create: true
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Each DaemonSet pod tails only the pods on ITS node. Without this selector every Alloy pod
      // discovered every pod in the cluster, so each line was shipped three times (live 2026-11-04).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")  // set by the chart from spec.nodeName
        }
      }

      discovery.relabel "filtered_pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "kube-system"
          action        = "drop"
        }

        // Promote the Kubernetes metadata to Loki labels. Without these only instance/job/service_name
        // existed and {namespace="dev"} matched nothing (live 2026-11-04).
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.filtered_pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  hostNetwork: false
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

configReloader:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi

serviceMonitor:
  enabled: true
  interval: 30s

rbac:
  create: true
