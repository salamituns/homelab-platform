# http://argocd.local through the shared Gateway (ADR 0013). Replaced argocd-ingress.yaml at the cutover; that
# Ingress's backend-protocol: "HTTP" is simply the default on the http listener.
# Managed by Argo CD (app cluster-config, k8s/platform/apps/cluster-config.yaml): change it in git.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: homelab-gateway   # accepts routes only from labelled namespaces (gateway.yaml)
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - argocd.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""   # the API server's defaults, spelled out so a server-side apply shows no drift
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
