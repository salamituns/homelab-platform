# OpenBao's Kubernetes auth checks ESO's ServiceAccount JWT against the API server's TokenReview
# endpoint (ADR 0014 step 3). The client's own JWT doubles as the reviewer credential, so OpenBao
# stores no long-lived reviewer token; for that the client ServiceAccount needs system:auth-delegator.
# The ServiceAccount itself lives in belleshop-deploy (namespace dev); more namespaces bind their
# own ServiceAccount here as they adopt ESO.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-tokenreview-belleshop
subjects:
  - kind: ServiceAccount
    name: eso-belleshop
    namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
