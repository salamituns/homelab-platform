# OpenBao's Kubernetes auth checks ESO's ServiceAccount JWT against the API server's TokenReview
# endpoint (ADR 0014 step 3). The client's own JWT doubles as the reviewer credential, so OpenBao
# stores no long-lived reviewer token; for that the client ServiceAccount needs system:auth-delegator.
# The ServiceAccounts live in their respective namespaces (`dev/eso-belleshop` in belleshop-deploy,
# `monitoring/eso-alertmanager` and `monitoring/eso-oidc` in k8s/platform/monitoring/manifests);
# more namespaces bind their own ServiceAccount here as they adopt ESO.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-tokenreview-belleshop
subjects:
  - kind: ServiceAccount
    name: eso-belleshop
    namespace: dev
  - kind: ServiceAccount
    name: eso-alertmanager
    namespace: monitoring
  - kind: ServiceAccount
    name: eso-oidc
    namespace: monitoring
  - kind: ServiceAccount
    name: eso-nexus-pull
    namespace: dev
  - kind: ServiceAccount
    name: eso-nexus-pull
    namespace: kyverno
  - kind: ServiceAccount
    name: eso-nexus-pull
    namespace: argo-rollouts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
