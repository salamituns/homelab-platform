# Day-to-day access in dev (ADR 0014 step 8). Bound to a group, not a user.
#
# This Role is not a Secret boundary inside `dev`:
# - pods/exec can read files and env already mounted from Secrets
# - patch on Rollouts (needed to promote) can change spec.template, including
#   volume mounts; Argo CD self-heal reverts that only after it has run
# Restart of a pod is delete, not patch of Deployments/StatefulSets (that patch
# is the same as creating a pod that mounts any Secret).
# It is a boundary for every other namespace and for cluster-scoped Secrets.
# Managed by Argo CD (app cluster-config).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: belleshop-operator
  namespace: dev
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [rollouts, rollouts/status]
    verbs: [get, list, watch, patch]
  - apiGroups: [argoproj.io]
    resources: [analysisruns, analysistemplates]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, secretstores]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: belleshop-operator
  namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: belleshop-operator
subjects:
  - kind: Group
    name: belleshop-operators
    apiGroup: rbac.authorization.k8s.io
