# Day-to-day access in dev (ADR 0014 step 8). Bound to a group, not a user.
# Secrets: no get/list/watch. Pod create is also denied: a created pod can mount
# any Secret in the namespace. pods/exec is allowed — it can still cat files
# already mounted into running pods (the backend DB password file, mysql env).
# That is accepted so the owner can debug and so scripts/openbao-setup-mysql-rotation.sh
# can exec into mysql-0 without the admin kubeconfig. Restart is pods/delete plus
# patch on Rollouts/Deployments/StatefulSets, not pod create.
# Managed by Argo CD (app cluster-config).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: belleshop-operator
  namespace: dev
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale, statefulsets, statefulsets/scale, replicasets]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [argoproj.io]
    resources: [rollouts, rollouts/scale, rollouts/status, analysisruns, analysistemplates]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, secretstores]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: belleshop-operator
  namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: belleshop-operator
subjects:
  - kind: Group
    name: belleshop-operators
    apiGroup: rbac.authorization.k8s.io
