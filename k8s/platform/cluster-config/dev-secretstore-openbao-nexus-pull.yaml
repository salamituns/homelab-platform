# Namespace-scoped SecretStore for `dev/nexus-pull`, separate from `SecretStore/openbao`
# (owned by belleshop-deploy for BelleShop app/DB secrets) so the two OpenBao roles stay
# per-path least-privilege (same pattern as monitoring/secretstore-openbao-oidc.yaml).
# Authenticates as dev/eso-nexus-pull against OpenBao's `nexus-pull-dev` role, which carries
# the `nexus-pull-read` policy (read-only on `secret/data/platform/nexus-pull`, written by
# scripts/openbao-breakglass.sh root-run nexus-pull).
# caBundle is the sectools Caddy Local Authority 2026 ECC Root certificate from
# homelab-platform ansible/files/ca/sectools-caddy-root.crt.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-nexus-pull
  namespace: dev
spec:
  provider:
    vault:
      server: https://bao.home.arpa
      path: secret
      version: v2
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: nexus-pull-dev
          serviceAccountRef:
            name: eso-nexus-pull
