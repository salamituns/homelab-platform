# Cluster-wide read of status (ADR 0014 step 8). The ADR's default is a Role
# per namespace; this is a ClusterRole because nodes and namespaces are
# cluster-scoped, and the daily question "is Argo synced / is a node Ready /
# did ESO fail" spans argocd, kube-system and dev. It still has no Secret
# verbs. Bound to a group, not a user.
# Managed by Argo CD (app cluster-config).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-viewer
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, appprojects, rollouts, analysisruns, analysistemplates]
    verbs: [get, list, watch]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, secretstores, clusterexternalsecrets, clustersecretstores]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, gatewayclasses, httproutes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-viewer
subjects:
  - kind: Group
    name: platform-viewers
    apiGroup: rbac.authorization.k8s.io
