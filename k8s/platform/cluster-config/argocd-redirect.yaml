# The http->https redirect for argocd.apps.home.arpa (ADR 0015 B). A separate route so the
# redirect is per-host and reversible on its own: delete this file and http stops redirecting,
# the serving route on https is untouched. NGF supports requestRedirect (Core filter; NGF picks
# the first filter and it cannot be combined with urlRewrite, which this route never uses).
# Managed by Argo CD (app cluster-config, k8s/platform/apps/cluster-config.yaml): change it in git.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-redirect
  namespace: argocd
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - argocd.apps.home.arpa
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
