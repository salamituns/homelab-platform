# ExternalSecret syncing `dev/nexus-pull` (kubernetes.io/dockerconfigjson for k8s-pull on
# registry.home.arpa) from OpenBao `secret/data/platform/nexus-pull` (ADR 0014, ADR 0019 Phase 0).
# Cut-over from the existing hand-made Secret follows docs/runbooks/tenant-secrets.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-pull
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-nexus-pull
    kind: SecretStore
  target:
    name: nexus-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        .dockerconfigjson: |
          {"auths":{"registry.home.arpa":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: platform/nexus-pull
        property: username
    - secretKey: password
      remoteRef:
        key: platform/nexus-pull
        property: password
