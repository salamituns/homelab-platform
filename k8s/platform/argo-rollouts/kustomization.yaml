# Argo Rollouts v1.9.1: controller + dashboard. Upstream files carry no namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-rollouts
resources:
  - vendor/argo-rollouts-install-v1.9.1.yaml
  - vendor/argo-rollouts-dashboard-install-v1.9.1.yaml
  - rollouts-httproute.yaml   # same host via the Gateway on .244 (ADR 0013 step 3)
  - rollouts-redirect.yaml    # http -> https for the same host (ADR 0015 B)
  - netpol-allow.yaml   # allow flows (ADR 0015 A appendix, round 2); never inert with the agent live
  - netpol-default-deny.yaml   # default-deny ingress+egress (ADR 0015 A, round 2)
  - eso-nexus-pull-sa.yaml
  - secretstore-openbao-nexus-pull.yaml
  - externalsecret-nexus-pull.yaml
# Plugin image is owner-pushed to belleshop (k8s-pull cannot read the ghcr proxy).
# Add digest: after the first push (runbook). Tag v0.17.0 is allow_once.
images:
  - name: registry.home.arpa/belleshop/rollouts-gatewayapi-plugin
    newTag: v0.17.0
patches:
  # Gateway API traffic router for canaries (ADR 0013). file:// so the controller never
  # fetches GitHub. v1.9.1 only SHA-256-checks http(s); the initContainer sha256sum -c is
  # the enforced check (same digest as the GitHub release). HTTPRoute RBAC lives in
  # belleshop-deploy, not here.
  - target:
      kind: ConfigMap
      name: argo-rollouts-config
    patch: |-
      - op: add
        path: /data
        value:
          trafficRouterPlugins: |-
            - name: "argoproj-labs/gatewayAPI"
              location: "file:///home/argo-rollouts/plugin-bin/gatewayapi-plugin-linux-amd64"
              sha256: "1904ca787d33107c140521899d61fff030ee75d99908bd175fca5a4647759061"
  # Plugins load at start: changing this value restarts the controller through Argo CD when the plugin changes.
  - target:
      kind: Deployment
      name: argo-rollouts
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          homelab.arpa/traffic-router-plugins: gatewayapi-v0.17.0-file
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: nexus-pull
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: copy-gatewayapi-plugin
            image: registry.home.arpa/belleshop/rollouts-gatewayapi-plugin:v0.17.0
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "-c"]
            args:
              - echo "1904ca787d33107c140521899d61fff030ee75d99908bd175fca5a4647759061  /plugin/gatewayapi-plugin-linux-amd64" | sha256sum -c && cp /plugin/gatewayapi-plugin-linux-amd64 /home/argo-rollouts/plugin-bin/gatewayapi-plugin-linux-amd64
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 32Mi
            volumeMounts:
              - name: plugin-bin
                mountPath: /home/argo-rollouts/plugin-bin
