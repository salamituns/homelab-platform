# http://rollouts.local through the shared Gateway (ADR 0013 step 3). Same host and backend as
# rollouts-ingress.yaml next to it; both stay live until the cutover (ingress-nginx on .240,
# Gateway on .244).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-rollouts-dashboard
  namespace: argo-rollouts
spec:
  parentRefs:
    - name: homelab-gateway   # accepts routes only from labelled namespaces (gateway.yaml)
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - rollouts.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""   # the API server's defaults, spelled out so a server-side apply shows no drift
          kind: Service
          name: argo-rollouts-dashboard
          port: 3100
