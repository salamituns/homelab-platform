# http://rollouts.local through the shared Gateway (ADR 0013). Replaced rollouts-ingress.yaml at the cutover.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-rollouts-dashboard
  namespace: argo-rollouts
spec:
  parentRefs:
    - name: homelab-gateway   # accepts routes only from labelled namespaces (gateway.yaml)
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - rollouts.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argo-rollouts-dashboard
          port: 3100
