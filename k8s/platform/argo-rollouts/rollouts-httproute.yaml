# https://rollouts.apps.home.arpa through the shared Gateway (ADR 0013; renamed and moved to the
# https listener by ADR 0015 B). http:// now gets the argo-rollouts-redirect answer (302 to https).
# Replaced rollouts-ingress.yaml at the cutover.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-rollouts-dashboard
  namespace: argo-rollouts
spec:
  parentRefs:
    - name: homelab-gateway   # accepts routes only from labelled namespaces (gateway.yaml)
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - rollouts.apps.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argo-rollouts-dashboard
          port: 3100
