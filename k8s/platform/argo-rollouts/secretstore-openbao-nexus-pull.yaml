# Namespace-scoped SecretStore for `argo-rollouts/nexus-pull` (patterned after
# k8s/platform/monitoring/manifests/secretstore-openbao.yaml). Authenticates as
# argo-rollouts/eso-nexus-pull against OpenBao's `nexus-pull-argo-rollouts` role, which carries
# the `nexus-pull-read` policy (read-only on `secret/data/platform/nexus-pull`, written by
# scripts/openbao-breakglass.sh root-run nexus-pull).
# caBundle is the sectools Caddy Local Authority 2026 ECC Root certificate from
# homelab-platform ansible/files/ca/sectools-caddy-root.crt.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-nexus-pull
  namespace: argo-rollouts
spec:
  provider:
    vault:
      server: https://bao.home.arpa
      path: secret
      version: v2
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: nexus-pull-argo-rollouts
          serviceAccountRef:
            name: eso-nexus-pull
