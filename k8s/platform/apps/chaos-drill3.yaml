# Week 8 Drill 3 (Expired Certificate, ADR 0018 owner override): isolated TLS
# server in chaos-drill3 probed directly by blackbox_exporter on :8443. Never
# touches homelab-gateway (.240), Certificate/apps-home-arpa, ClusterIssuer/lab-ca,
# or any HTTPRoute. Clean-up after the drill is removing this Application and
# the chaos-expiry Probe/egress rule in k8s/platform/blackbox/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-drill3
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: https://gitea.home.arpa/tunsgit/homelab-platform.git
    targetRevision: main
    path: k8s/platform/chaos-drill3
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-drill3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
