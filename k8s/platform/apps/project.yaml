# The platform's Argo CD project: which repos may be deployed, to which namespaces, and which
# cluster-wide kinds they may create. Least privilege: the 13 cluster-scoped kinds the add-ons use.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster add-ons managed from homelab-platform (ADR 0008)
  sourceRepos:
    - https://gitea.home.arpa/tunsgit/homelab-platform.git
    - https://prometheus-community.github.io/helm-charts
    - https://kyverno.github.io/kyverno/
    - https://kyverno.github.io/kyverno
    - https://charts.external-secrets.io
    - https://charts.jetstack.io   # cert-manager (ADR 0015 B)
    - https://falcosecurity.github.io/charts   # falco + falcosidekick (ADR 0015 D)
    - https://oauth2-proxy.github.io/manifests   # oauth2-proxy (ADR 0016 step 3)
    - https://grafana-community.github.io/helm-charts   # OSS Loki (ADR 0017; grafana/loki 7.x is GEL-only)
    - https://grafana.github.io/helm-charts   # Grafana Alloy (ADR 0017)
  destinations:
    - { server: https://kubernetes.default.svc, namespace: argocd }
    - { server: https://kubernetes.default.svc, namespace: kube-system }
    - { server: https://kubernetes.default.svc, namespace: metallb-system }
    - { server: https://kubernetes.default.svc, namespace: argo-rollouts }
    - { server: https://kubernetes.default.svc, namespace: local-path-storage }
    - { server: https://kubernetes.default.svc, namespace: monitoring }
    - { server: https://kubernetes.default.svc, namespace: kyverno }
    - { server: https://kubernetes.default.svc, namespace: nginx-gateway }
    - { server: https://kubernetes.default.svc, namespace: external-secrets }
    - { server: https://kubernetes.default.svc, namespace: cert-manager }             # internal CA (ADR 0015 B)
    - { server: https://kubernetes.default.svc, namespace: falco }                    # runtime alerts (ADR 0015 D)
    - { server: https://kubernetes.default.svc, namespace: kube-network-policies }    # policy enforcement (ADR 0015 A)
    - { server: https://kubernetes.default.svc, namespace: chaos-drill4 }             # Week 8 drill 4 emptyDir canary
    - { server: https://kubernetes.default.svc, namespace: dev }   # access Role and binding only (ADR 0014 step 8)
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration }
    - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
    - { group: networking.k8s.io, kind: IngressClass }
    - { group: storage.k8s.io, kind: StorageClass }
    - { group: apiregistration.k8s.io, kind: APIService }   # metrics-server
    - { group: policies.kyverno.io, kind: ImageValidatingPolicy }
    - { group: policies.kyverno.io, kind: ValidatingPolicy }
    - { group: gateway.networking.k8s.io, kind: GatewayClass }                         # NGINX Gateway Fabric (ADR 0013)
    - { group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy }         # Gateway API CRD upgrade guard
    - { group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding }
    - { group: cert-manager.io, kind: ClusterIssuer }                                  # lab CA (ADR 0015 B)
  orphanedResources:
    warn: true   # show live objects in these namespaces that git does not declare
