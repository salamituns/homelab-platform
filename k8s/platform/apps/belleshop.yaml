# BelleShop runs what belleshop-deploy says, at the digests CI promoted by PR (ADR 0012).
# Owned by platform-root since Week 4; before that the Application managed itself from BelleShop's k8s/.
# The resources finalizer stays: deleting this Application deletes BelleShop from dev, on purpose only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: belleshop
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitea.home.arpa/tunsgit/belleshop-deploy.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  # Argo Rollouts steps the canary weights on this route during a rollout (ADR 0013). Without this, self-heal would
  # put git's 100/0 back mid-canary. Only the weights are ignored; any other change to the route still shows as drift.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: belleshop-api
      jqPathExpressions:
        - .spec.rules[]?.backendRefs[]?.weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
