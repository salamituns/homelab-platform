apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    # Server-side diff to match ServerSideApply: the legacy diff counts every API-server default (HTTPRoute
    # backendRef group/kind/weight, parentRef group/kind) as drift (ADR 0013 step 5; same lesson as Kyverno, ADR 0012).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  # Chart from the Helm repo, values from this git repo. releaseName keeps every object name the same
  # as the old `helm install prometheus-stack`, so Argo CD adopts the live objects instead of duplicating them.
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.3.0
      helm:
        releaseName: prometheus-stack
        valueFiles:
          - $values/k8s/platform/monitoring/values.yaml
    - repoURL: https://gitea.home.arpa/tunsgit/homelab-platform.git
      targetRevision: main
      ref: values
    - repoURL: https://gitea.home.arpa/tunsgit/homelab-platform.git
      targetRevision: main
      path: k8s/platform/monitoring/manifests   # extras next to the chart (Grafana ingress)
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true   # Prometheus Operator CRDs are too big for client-side apply
      - CreateNamespace=true
