# External Secrets Operator copies secrets from OpenBao into Kubernetes Secrets (ADR 0014 step 3).
# The Vault provider authenticates with ESO's ServiceAccount JWT: OpenBao sends it to TokenReview
# using that same JWT, so no long-lived reviewer token is stored (cluster-config/eso-tokenreview.yaml).
# The resources finalizer stays: deleting this Application removes ESO from the cluster, on purpose only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Compare the way it applies (ServerSideApply below). The cert controller patches caBundle
    # into the webhook at runtime; the chart renders no caBundle, so the legacy diff would be
    # OutOfSync forever (same lesson as Kyverno, ADR 0012).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/k8s/platform/external-secrets/values.yaml
    - repoURL: https://gitea.home.arpa/tunsgit/homelab-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
