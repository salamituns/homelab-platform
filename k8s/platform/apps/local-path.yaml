apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://gitea.home.arpa/tunsgit/homelab-platform.git
    targetRevision: main
    path: k8s/platform/local-path
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
