apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    # Server-side diff to match ServerSideApply: the legacy diff counts every API-server default (HTTPRoute
    # backendRef group/kind/weight, parentRef group/kind) as drift (ADR 0013 step 5; same lesson as Kyverno, ADR 0012).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: https://gitea.home.arpa/tunsgit/homelab-platform.git
    targetRevision: main
    path: k8s/platform/argo-rollouts
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true   # the Rollout CRDs are too big for client-side apply annotation
