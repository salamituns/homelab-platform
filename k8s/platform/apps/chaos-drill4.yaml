# Week 8 drill 4 (ADR 0018): capped emptyDir fill on master.
# resources-finalizer: deleting THIS Application cascades to its objects.
# That is not enough by itself: platform-root has prune: false, so removing
# this file from git leaves the Application running (drill 3 lesson). Owner
# still runs `kubectl -n argocd delete application chaos-drill4` after the
# revert PR; the finalizer then prunes the Failed pod and NetworkPolicy.
# CreateNamespace does not delete the namespace on app delete — also
# `kubectl delete ns chaos-drill4`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-drill4
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://gitea.home.arpa/tunsgit/homelab-platform.git
    targetRevision: main
    path: k8s/platform/chaos-drill4
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-drill4
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
