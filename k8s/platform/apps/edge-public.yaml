# Cloudflare Tunnel connector in edge-public (ADR 0019 D7). Namespace is in git
# (PSA labels); CreateNamespace=false so Argo cannot create an unlabelled ns first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-public
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://gitea.home.arpa/tunsgit/homelab-platform.git
    targetRevision: main
    path: k8s/platform/edge-public
  destination:
    server: https://kubernetes.default.svc
    namespace: edge-public
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
