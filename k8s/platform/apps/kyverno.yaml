apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  # Chart 3.9.2 ships Kyverno v1.19.2 (ADR 0012). Values live in this repo.
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.9.2
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/k8s/platform/kyverno/values.yaml
    - repoURL: https://gitea.home.arpa/tunsgit/homelab-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    # Chart 3.9.2 renders `labels: {}` on the policies.kyverno.io CRDs; server-side apply stores no field,
    # so the app showed OutOfSync forever. A jq select(. == {}) passed `argocd app diff` but not the
    # controller's comparison, so labels are ignored on this app's CRDs (Kyverno's own) altogether.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/labels
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - .webhooks[]?.rules
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - .webhooks[]?.rules
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true   # Kyverno CRDs exceed the client-side last-applied-configuration limit
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
