# Merge keys only. Do not kubectl replace: live argocd-cm also holds
# resource.exclusions / resource.customizations.ignoreResourceUpdates.*
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Live (2026-11-04) has no url. RedirectURL is url + /auth/callback (v3.5.1).
  url: https://argocd.apps.home.arpa
  # Keep local admin as break-glass (parseAdminAccount defaults Enabled true; set explicitly).
  admin.enabled: "true"
  oidc.config: |
    name: Gitea
    issuer: https://gitea.home.arpa
    clientID: $oidc.gitea.clientID
    clientSecret: $oidc.gitea.clientSecret
    requestedScopes:
      - openid
      - profile
      - email
      - groups
    requestedIDTokenClaims:
      groups:
        essential: true
    enablePKCEAuthentication: true
    rootCA: |
