# Inner YAML for argocd-cm data.oidc.config (v3.5.1 OIDCConfig).
# clientID/clientSecret are $key refs; replaceStringSecret looks them up in argocd-secret.
# rootCA is PEM, not a volume path. Byte-identical to ansible/files/ca/gitea-caddy-root.crt
# (Gitea is signed by this Caddy root, not the lab root).
name: Gitea
issuer: https://gitea.home.arpa
clientID: $oidc.gitea.clientID
clientSecret: $oidc.gitea.clientSecret
requestedScopes:
  - openid
  - profile
  - email
  - groups
requestedIDTokenClaims:
  groups:
    essential: true
enablePKCEAuthentication: true
