# Drill 4 canary. Name prefix is the live alert matcher
# HomelabDiskCanaryEvicted: pod=~"homelab-disk-canary.*".
#
# Bare Pod, restartPolicy Never: kubelet eviction leaves a Failed object.
# Argo compares spec, so the Failed pod stays Synced; health is Degraded
# (built-in Pod health: Failed => Degraded). selfHeal will NOT recreate it
# unless someone deletes the object (same name, spec unchanged). Do not
# kubectl-delete the Failed pod while this app exists.
#
# sizeLimit 256Mi is the cap; dd asks for 300Mi so eviction is the success
# path. Do not use count=512 (ADR first draft). Pin is docker.io like Alloy.
apiVersion: v1
kind: Pod
metadata:
  name: homelab-disk-canary
  namespace: chaos-drill4
  labels:
    app: homelab-disk-canary
    drill: "4"
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: master
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: fill
      image: docker.io/library/busybox:1.36.1@sha256:650fd573e056b679a5110a70aabeb01e26b76e545ec4b9c70a9523f2dfaf18c6
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - dd if=/dev/zero of=/scratch/fill bs=1M count=300; sleep 3600
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
      volumeMounts:
        - name: scratch
          mountPath: /scratch
  volumes:
    - name: scratch
      emptyDir:
        sizeLimit: 256Mi
