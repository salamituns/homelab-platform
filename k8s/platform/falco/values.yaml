# Falco chart 9.2.2 (appVersion 0.45.2, falcosidekick 2.35.1) values
# for homelab-platform (ADR 0015 section D, step 5). No falcoctl containers run
# (see the falcoctl block below for the 2026-11-03 ghcr.io 429 incident).
#
# Kernel verification (all 3 nodes: master, workernode1, workernode2):
#   - OS / kernel: Ubuntu 24.04.3 LTS, Linux 6.8.0-147-generic
#   - BTF exposed: /sys/kernel/btf/vmlinux present (5.9 MiB)
#   - Runtime:     containerd://2.2.1 (/run/containerd/containerd.sock)
# Kernel 6.8 (>= 5.8 with CONFIG_DEBUG_INFO_BTF) supports the built-in CO-RE modern
# eBPF probe (`modern_ebpf`) without compiling or downloading kernel headers or
# running the `falco-driver-loader` initContainer.

image:
  registry: docker.io
  repository: falcosecurity/falco
  tag: "0.45.2@sha256:1562a643953f938e02f47319b5214d93a235f11f646d60e9b8a516fd5a64698e"
  pullPolicy: IfNotPresent

driver:
  enabled: true
  # Built-in CO-RE modern eBPF probe; disables the driver-loader initContainer.
  kind: modern_ebpf
  modernEbpf:
    # Grants BPF, PERFMON, SYS_RESOURCE, and SYS_PTRACE instead of full privileged: true.
    leastPrivileged: true

collectors:
  enabled: true
  containerEngine:
    enabled: true
    engines:
      containerd:
        enabled: true
        sockets:
          - /run/containerd/containerd.sock
      cri:
        enabled: true
        sockets:
          - /run/containerd/containerd.sock
      docker:
        enabled: false
      podman:
        enabled: false

# Attach a TTY so Falco flushes stdout events immediately (`kubectl -n falco logs`
# used by scripts/falco-proof.sh).
tty: true

# Platform-controller exemption for "Contact K8S API Server From Container".
#
# WHY: that rule fires for every legitimate watcher of the Kubernetes API, and it was
# 64 of the 65 Falco events in the 24h before this change (argocd
# argocd-application-controller-0: 44, argo-rollouts controller: 19, one monitoring
# admission-create Job; the only other event was the deliberate shell-in-container
# proof in dev). At falcosidekick minimumpriority notice every one became an email.
# The upstream ruleset ships the macro as a `never_true` placeholder exactly so a
# deployment can define "known" actors; this override replaces the placeholder with a
# namespace allowlist of the platform controllers that live in this cluster (verified
# against `kubectl get ns` 2026-11-03). NOT exempted: dev, default, kube-public,
# kube-node-lease - app namespaces still page on first API contact. The
# shell-in-container rule and all other rules are untouched.
customRules:
  homelab-exemptions.yaml: |-
    # Loaded after falco_rules.yaml (chart customRules land in /etc/falco/rules.d), so
    # this override applies to the upstream macro. `condition: replace` is the 0.45
    # override syntax (validated for real: falco -V with the exact live falco_rules.yaml
    # of 2026-11-03 plus this file reports Ok; the same setup with a deliberately broken
    # condition fails with LOAD_ERR_COMPILE_CONDITION, so the check is not vacuous).
    - macro: user_known_contact_k8s_api_server_activities
      condition: (k8s.ns.name in ("argocd", "argo-rollouts", "cert-manager", "external-secrets", "falco", "kube-flannel", "kube-network-policies", "kube-system", "kyverno", "local-path-storage", "metallb-system", "monitoring", "nginx-gateway"))
      override:
        condition: replace

# Sized for the 3-node lab (4 GB workers alongside Argo CD, Kyverno, and monitoring).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# No falcoctl containers. WHY: on 2026-11-03 (~21:30 UTC), after PR #41 rolled the
# DaemonSet, the falcoctl-artifact-install init container crashed every new pod with
# ghcr.io 429 toomanyrequests - it pulls `falco-rules:5` and
# `ghcr.io/falcosecurity/plugins/plugin/container:0.7.6` at startup - so falco-cnhcm
# sat in Init:CrashLoopBackOff and workernode1 had NO runtime detection (a manual curl
# of the same manifest from the node worked; the failure was intermittent rate
# limiting, i.e. every rollout is a coin toss per pod). The pinned
# falcosecurity/falco:0.45.2 image ALREADY ships /etc/falco/falco_rules.yaml
# (byte-identical to the falcoctl-installed falco-rules:5, verified 2026-11-03) and
# /usr/share/falco/plugins/libcontainer.so; the chart shadows those paths with
# emptyDirs ONLY while install or follow is enabled, so with both disabled falco
# loads the image's own copies. Startup then contacts nothing outside the registry
# holding the digest-pinned falco image (no ghcr.io, no falcoctl artifact index).
# Rules now update when the IMAGE version+digest pin below is bumped, which is
# already how this repo controls every other image. If you ever re-enable artifact
# install or follow, re-pin the falcoctl image (0.14.3) alongside them.
falcoctl:
  artifact:
    install:
      enabled: false
    follow:
      enabled: false

falcosidekick:
  enabled: true
  replicaCount: 1
  image:
    registry: docker.io
    repository: falcosecurity/falcosidekick
    tag: "2.35.1@sha256:a9bb60d2c7742febd912315ca1155839abc0199bf322c58d3adbb8b0849fadb9"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  config:
    alertmanager:
      hostport: "http://prometheus-stack-kube-prom-alertmanager.monitoring.svc.cluster.local:9093"
      # Alertmanager v0.27+ removed /api/v1/alerts; kube-prometheus-stack 88.3.0 runs
      # Alertmanager v0.33.1 which serves /api/v2/alerts.
      endpoint: "/api/v2/alerts"
      # Forward Notice and higher (includes "Terminal shell in container" which is Notice).
      minimumpriority: "notice"
      extralabels: "source:falco"
