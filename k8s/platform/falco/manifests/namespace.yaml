# Namespace for Falco + falcosidekick (ADR 0015 section D).
# Pod Security Admission is set to `privileged` because the Falco DaemonSet mounts host
# `/proc` and `/run/containerd` and requires `BPF`, `PERFMON`, `SYS_RESOURCE`, and
# `SYS_PTRACE` capabilities for the modern eBPF probe (`modern_ebpf`).
# `homelab.arpa/admission: enforced` is intentionally omitted: platform add-ons pull
# digest-pinned upstream images and are excluded from Kyverno webhooks (ADR 0012).
apiVersion: v1
kind: Namespace
metadata:
  name: falco
  labels:
    kubernetes.io/metadata.name: falco
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
