# External Secrets Operator chart 2.14.0 values for homelab-platform (ADR 0014 step 3).
# The CRDs (SecretStore, ExternalSecret, ...) come with the chart (installCRDs, default on).
# One controller replica and modest requests: the 4 GB workers already run Argo CD, Kyverno,
# monitoring and the gateway data plane. The image stays the chart default (ghcr.io), the
# same direct-upstream pull the Kyverno and kube-prometheus-stack charts use.
replicaCount: 1
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Expose :8080/metrics via Service + ServiceMonitor so Prometheus scrapes externalsecret_status_condition
# (ADR 0014 follow-up).
# - renderMode: alwaysRender is required because Argo CD renders Helm charts offline without live CRD
#   discovery; the chart default (skipIfMissing) omits both the metrics Services and ServiceMonitors.
# - honorLabels: true preserves the ExternalSecret's own namespace="dev" label instead of overwriting
#   it with the ESO pod's namespace="external-secrets" (same setting kube-state-metrics uses).
serviceMonitor:
  enabled: true
  renderMode: alwaysRender
  honorLabels: true
