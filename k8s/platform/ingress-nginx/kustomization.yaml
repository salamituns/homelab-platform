# ingress-nginx controller v1.15.1, "cloud" static manifest (LoadBalancer Service, externalTrafficPolicy Local).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vendor/ingress-nginx-cloud-v1.15.1.yaml
# The two admission-cert Jobs, as patched for Argo CD:
# - a Job's pod template is immutable, so a new certgen image fails a normal apply: Force+Replace deletes and recreates them;
# - upstream's ttlSecondsAfterFinished: 0 deletes them when done, which self-heal sees as drift and recreates in a loop.
patches:
  - target:
      kind: Job
      namespace: ingress-nginx
    patch: |-
      - op: remove
        path: /spec/ttlSecondsAfterFinished
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Force=true,Replace=true
