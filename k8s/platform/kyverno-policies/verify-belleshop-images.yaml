# ADR 0012: BelleShop images (registry.home.arpa/belleshop/*) must be signed by our Cosign key
# (no transparency log, no Fulcio/SCT), carry a signed SPDX SBOM attestation, be mutated from
# tag to digest at admission, and carry a digest when validated. Rolled out in Audit mode first.
apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: verify-belleshop-images
  annotations:
    policies.kyverno.io/title: Verify BelleShop Image Signatures and SBOM Attestations
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Verifies that every registry.home.arpa/belleshop/* image carries a valid Cosign v3
      Sigstore bundle signature and an SPDX SBOM attestation (https://spdx.dev/Document)
      signed by the homelab Cosign key (without transparency log), mutating tags to digests.
spec:
  failurePolicy: Fail
  validationActions:
    - Audit
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  credentials:
    providers:
      - default
    secrets:
      - nexus-pull
  matchConstraints:
    namespaceSelector:
      matchLabels:
        homelab.arpa/admission: enforced
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "registry.home.arpa/belleshop/*"
  attestors:
    - name: belleshop
      cosign:
        key:
          data: |
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE5JAg935sFy1XUwsdi1MD5+xRtWbJ
            reA3iv9/MOvs/70iYpiEapyluzhy47wPV5jIiVmxhbTjE++lnnz70ASoPg==
            -----END PUBLIC KEY-----
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  attestations:
    - name: sbom
      intoto:
        type: https://spdx.dev/Document
  validations:
    - expression: >-
        [images.containers, images.initContainers, images.ephemeralContainers].flatten().map(image, verifyImageSignatures(image, [attestors.belleshop])).all(e, e > 0)
      message: >-
        BelleShop image signature verification failed: image must be signed by the homelab Cosign key.
    - expression: >-
        [images.containers, images.initContainers, images.ephemeralContainers].flatten().map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.belleshop])).all(e, e > 0)
      message: >-
        BelleShop image SBOM attestation verification failed: image must carry a signed SPDX SBOM (https://spdx.dev/Document).
