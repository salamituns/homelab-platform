# Good Pod: all images from registry.home.arpa/, pinned by @sha256: digest (no :latest),
# and CPU + memory requests and memory limits set on every container.
apiVersion: v1
kind: Pod
metadata:
  name: good-belleshop-pod
  namespace: dev
spec:
  initContainers:
    - name: db-wait
      image: registry.home.arpa/dockerhub/library/busybox:1.36.1@sha256:650fd573e056b679a5110a70aabeb01e26b76e545ec4b9c70a9523f2dfaf18c6
  containers:
    - name: backend
      image: registry.home.arpa/belleshop/belleshop-backend:c3f1304d2f1a@sha256:352882b7b790190239cf315bfc5b383f762abdef20be34af678770245b2fef26
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
  ephemeralContainers:
    - name: debug
      image: registry.home.arpa/dockerhub/library/busybox:1.36.1@sha256:650fd573e056b679a5110a70aabeb01e26b76e545ec4b9c70a9523f2dfaf18c6
---
# Good Argo Rollout: matches BelleShop's Rollout structure with compliant registry, digest pin, and resources.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: good-belleshop-rollout
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: belleshop-backend
  template:
    metadata:
      labels:
        app: belleshop-backend
    spec:
      containers:
        - name: backend
          image: registry.home.arpa/belleshop/belleshop-backend:c3f1304d2f1a@sha256:352882b7b790190239cf315bfc5b383f762abdef20be34af678770245b2fef26
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
# Bad Pod (b - restrict-registries): main container pulls from Docker Hub instead of registry.home.arpa/.
apiVersion: v1
kind: Pod
metadata:
  name: bad-registry-container
  namespace: dev
spec:
  containers:
    - name: mysql
      image: docker.io/library/mysql:8.0@sha256:deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi
---
# Bad Pod (b - restrict-registries): initContainer pulls from ghcr.io instead of registry.home.arpa/.
apiVersion: v1
kind: Pod
metadata:
  name: bad-registry-initcontainer
  namespace: dev
spec:
  initContainers:
    - name: init
      image: ghcr.io/someorg/init:1.0.0@sha256:deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
  containers:
    - name: backend
      image: registry.home.arpa/belleshop/belleshop-backend:c3f1304d2f1a@sha256:352882b7b790190239cf315bfc5b383f762abdef20be34af678770245b2fef26
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
---
# Bad Pod (b - restrict-registries): ephemeralContainer pulls from Docker Hub instead of registry.home.arpa/.
apiVersion: v1
kind: Pod
metadata:
  name: bad-registry-ephemeralcontainer
  namespace: dev
spec:
  containers:
    - name: backend
      image: registry.home.arpa/belleshop/belleshop-backend:c3f1304d2f1a@sha256:352882b7b790190239cf315bfc5b383f762abdef20be34af678770245b2fef26
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
  ephemeralContainers:
    - name: debug
      image: busybox:1.36.1@sha256:650fd573e056b679a5110a70aabeb01e26b76e545ec4b9c70a9523f2dfaf18c6
---
# Bad Pod (c - require-digest): tag-only reference without @sha256: digest.
apiVersion: v1
kind: Pod
metadata:
  name: bad-tag-without-digest
  namespace: dev
spec:
  containers:
    - name: backend
      image: registry.home.arpa/belleshop/belleshop-backend:c3f1304d2f1a
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
---
# Bad Pod (c - disallow-latest + require-digest): uses mutable :latest tag without digest.
apiVersion: v1
kind: Pod
metadata:
  name: bad-latest-tag
  namespace: dev
spec:
  containers:
    - name: backend
      image: registry.home.arpa/belleshop/belleshop-backend:latest
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
---
# Bad Pod (c - disallow-latest): uses :latest tag even though a digest is present.
apiVersion: v1
kind: Pod
metadata:
  name: bad-latest-with-digest
  namespace: dev
spec:
  containers:
    - name: backend
      image: registry.home.arpa/belleshop/belleshop-backend:latest@sha256:352882b7b790190239cf315bfc5b383f762abdef20be34af678770245b2fef26
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
