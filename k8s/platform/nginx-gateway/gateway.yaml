# The one shared Gateway (ADR 0013). Staging address .244 while ingress-nginx keeps .240; the cutover moves this to .240.
# Routes attach only from namespaces that opt in with the label below, the same opt-in style as Kyverno's.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  # The address is requested from MetalLB, not set with spec.addresses: NGF turns spec.addresses into Service
  # externalIPs, which kube-proxy accepts but MetalLB never announces on the LAN. NGF copies these annotations onto
  # the Service it generates (homelab-gateway-nginx). MetalLB v0.14 reads the metallb.universe.tf key, not metallb.io.
  infrastructure:
    annotations:
      metallb.universe.tf/loadBalancerIPs: 192.168.1.244
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.arpa/gateway-routes: "true"
