# The one shared Gateway (ADR 0013), on 192.168.1.240: the address ingress-nginx had until the cutover, so DNS and
# every client stayed the same.
# Routes attach only from namespaces that opt in with the label below, the same opt-in style as Kyverno's.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  # The address is requested from MetalLB, not set with spec.addresses: NGF turns spec.addresses into Service
  # externalIPs, which kube-proxy accepts but MetalLB never announces on the LAN. NGF copies these annotations onto
  # the Service it generates (homelab-gateway-nginx). MetalLB v0.14 reads the metallb.universe.tf key, not metallb.io.
  infrastructure:
    annotations:
      metallb.universe.tf/loadBalancerIPs: 192.168.1.240
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.arpa/gateway-routes: "true"
    # TLS termination for every *.apps.home.arpa host (ADR 0015 B). The Secret is issued by the
    # wildcard Certificate (cert-manager app) in THIS namespace, so no ReferenceGrant is needed
    # and no cross-namespace grant is opened. group/kind are spelled out because the API
    # defaults a bare reference to a Service (ADR 0013 spell-out lesson).
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: apps-home-arpa-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.arpa/gateway-routes: "true"   # same opt-in as http: one label admits a namespace to both
