# Syncs the remotely-managed Cloudflare Tunnel token from OpenBao
# secret/data/platform/cloudflared into Secret/cloudflared (key tunnel_token).
# ESO is unready until root-run cloudflared-token has run; that is expected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: cloudflared
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        tunnel_token: '{{ .tunnel_token }}'
  data:
    - secretKey: tunnel_token
      remoteRef:
        key: platform/cloudflared
        property: tunnel_token
