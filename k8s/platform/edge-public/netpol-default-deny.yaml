# Default-deny for the tunnel connector. Ingress is denied unless an allow
# names it (metrics scrape from monitoring is the only inbound today).
# kube-network-policies evaluates post-DNAT: peers are pods / node /32s, never ClusterIPs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-public-default-deny
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
