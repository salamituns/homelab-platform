# Namespace-scoped SecretStore: authenticates as edge-public/eso against OpenBao role
# `cloudflared` (policy cloudflared-read → secret/data/platform/cloudflared only).
# Created by scripts/openbao-breakglass.sh root-run cloudflared-token.
# caBundle is the sectools Caddy Local Authority 2026 ECC Root (same as monitoring).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: openbao
spec:
  provider:
    vault:
      server: https://bao.home.arpa
      path: secret
      version: v2
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: cloudflared
          serviceAccountRef:
            name: eso
