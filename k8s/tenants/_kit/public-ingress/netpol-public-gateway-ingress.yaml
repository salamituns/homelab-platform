# Extra ingress from the public Gateway data plane. Overlay may patch the port
# (kit default 8080). Do not add this to internal tenants.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: tenant-public-gateway-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: public-gateway-nginx
      ports:
        - protocol: TCP
          port: 8080
