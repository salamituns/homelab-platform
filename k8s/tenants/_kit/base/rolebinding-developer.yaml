# Overlay patches subjects[0].name to <app>-dev (Gitea OIDC group).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: tenant-developer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-developer
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: tenant-dev
