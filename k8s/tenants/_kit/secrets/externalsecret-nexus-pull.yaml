# ExternalSecret rendering the `nexus-pull` imagePullSecret (kubernetes.io/dockerconfigjson)
# for registry.home.arpa from OpenBao `secret/data/platform/nexus-pull` (ADR 0019 D1, D6).
# - `Prune=false` prevents Argo CD from pruning the ESO-managed Secret.
# - `spec.target.template` structure (`engineVersion: v2`, `metadata.annotations`, `data`)
#   follows k8s/platform/monitoring/manifests/externalsecret-alertmanager-config.yaml and
#   k8s/platform/oauth2-proxy/manifests/externalsecret-oauth2-proxy.yaml.
# - UNVERIFIED in repo docs (verified at runtime when ESO syncs): `type: kubernetes.io/dockerconfigjson`
#   and the v2 template functions `printf` / `b64enc` rendering `.auth` inside `.dockerconfigjson`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: nexus-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        .dockerconfigjson: |
          {"auths":{"registry.home.arpa":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: platform/nexus-pull
        property: username
    - secretKey: password
      remoteRef:
        key: platform/nexus-pull
        property: password
