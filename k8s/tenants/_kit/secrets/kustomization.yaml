# Reusable Kustomize component for tenant secret access via External Secrets Operator
# (ADR 0019 D1, D6, Phase 0). Consumed by each tenant environment overlay (<app>-<env>),
# which sets `namespace: <app>-<env>` and patches `SecretStore/openbao` role to `tenant-<app>-<env>`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - eso-sa.yaml
  - secretstore-openbao.yaml
  - externalsecret-nexus-pull.yaml
