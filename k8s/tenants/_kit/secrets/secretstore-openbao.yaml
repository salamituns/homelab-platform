# Namespace-scoped SecretStore for a tenant environment (<app>-<env>), patterned after
# k8s/platform/monitoring/manifests/secretstore-openbao.yaml (ADR 0014 step 3, ADR 0019 D6).
# Authenticates as <app>-<env>/eso against OpenBao's `tenant-<app>-<env>` role, whose
# policy grants read-only access to `secret/data/apps/<app>/<env>/*` and
# `secret/data/platform/nexus-pull` only (created by scripts/openbao-tenant.sh <app> <env>).
# caBundle is the sectools Caddy Local Authority 2026 ECC Root certificate from
# homelab-platform ansible/files/ca/sectools-caddy-root.crt.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://bao.home.arpa
      path: secret
      version: v2
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: tenant-<app>-<env>
          serviceAccountRef:
            name: eso
