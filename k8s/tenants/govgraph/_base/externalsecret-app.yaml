# Web + refresh env from OpenBao (ADR 0019 D6). The tenant policy in
# scripts/openbao-breakglass.sh is secret/data/apps/<app>/<env>/* (children only).
# The parent object apps/govgraph/<env> is not granted, so these keys are children:
# apps/govgraph/ENV/app and, for the purge token, apps/govgraph/ENV/cloudflare.
# Every env overlay MUST replace ENV. A rendered ENV fails at ESO and cannot read
# the other environment. The purge token is a separate Secret so web never sees it.
# Staging drops the cloudflare refs; that env has no such object.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: govgraph
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: govgraph
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        DATABASE_URL: "{{ .DATABASE_URL }}"
        CRON_SECRET: "{{ .CRON_SECRET }}"
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: apps/govgraph/ENV/app
        property: DATABASE_URL
    - secretKey: CRON_SECRET
      remoteRef:
        key: apps/govgraph/ENV/app
        property: CRON_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: govgraph-refresh
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: govgraph-refresh
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        DATABASE_URL: "{{ .DATABASE_URL }}"
        CRON_SECRET: "{{ .CRON_SECRET }}"
        CF_ZONE_ID: "{{ .CF_ZONE_ID }}"
        CF_API_TOKEN: "{{ .CF_API_TOKEN }}"
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: apps/govgraph/ENV/app
        property: DATABASE_URL
    - secretKey: CRON_SECRET
      remoteRef:
        key: apps/govgraph/ENV/app
        property: CRON_SECRET
    - secretKey: CF_ZONE_ID
      remoteRef:
        key: apps/govgraph/ENV/cloudflare
        property: CF_ZONE_ID
    - secretKey: CF_API_TOKEN
      remoteRef:
        key: apps/govgraph/ENV/cloudflare
        property: CF_API_TOKEN
