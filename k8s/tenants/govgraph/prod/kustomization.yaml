# Govgraph tenant prod (ADR 0019 D1, Phase 2). Public exposure; HTTPRoute in apps-deploy.
# Promotion to prod is a human PR in apps-deploy (staging digest copied to the prod overlay).
# OpenBao role tenant-govgraph-prod and group govgraph-dev are owner steps
# (docs/runbooks/govgraph.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: govgraph-prod
resources:
  - externalsecret-app.yaml
components:
  - ../../_kit/base
  - ../../_kit/public-ingress
  - ../netpol
patches:
  - target:
      version: v1
      kind: Namespace
      name: tenant
    patch: |-
      - op: replace
        path: /metadata/name
        value: govgraph-prod
      - op: add
        path: /metadata/labels/homelab.arpa~1tenant
        value: govgraph
      - op: add
        path: /metadata/labels/homelab.arpa~1env
        value: prod
      - op: replace
        path: /metadata/labels/homelab.arpa~1exposure
        value: public
  - target:
      group: external-secrets.io
      version: v1
      kind: SecretStore
      name: openbao
    patch: |-
      - op: replace
        path: /spec/provider/vault/auth/kubernetes/role
        value: tenant-govgraph-prod
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: tenant-developer
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: govgraph-dev
  - target:
      kind: NetworkPolicy
      name: tenant-public-gateway-ingress
    patch: |-
      - op: replace
        path: /spec/podSelector
        value:
          matchLabels:
            app.kubernetes.io/name: govgraph
            app.kubernetes.io/component: web
      - op: replace
        path: /spec/ingress/0/ports/0/port
        value: 3000
  - target:
      kind: NetworkPolicy
      name: tenant-gateway-ingress
    patch: |-
      - op: replace
        path: /spec/podSelector
        value:
          matchLabels:
            app.kubernetes.io/name: govgraph
            app.kubernetes.io/component: web
      - op: replace
        path: /spec/ingress/0/ports/0/port
        value: 3000
  - target:
      version: v1
      kind: ResourceQuota
      name: tenant-quota
    patch: |-
      - op: replace
        path: /spec/hard/pods
        value: "8"
      - op: replace
        path: /spec/hard/services
        value: "6"
      - op: replace
        path: /spec/hard/requests.cpu
        value: "1"
      - op: replace
        path: /spec/hard/requests.memory
        value: 1536Mi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "2"
      - op: replace
        path: /spec/hard/limits.memory
        value: 3Gi
  - target:
      version: v1
      kind: LimitRange
      name: tenant-limits
    patch: |-
      - op: replace
        path: /spec/limits/0/default/cpu
        value: 500m
      - op: replace
        path: /spec/limits/0/default/memory
        value: 768Mi
      - op: replace
        path: /spec/limits/0/defaultRequest/cpu
        value: 200m
      - op: replace
        path: /spec/limits/0/defaultRequest/memory
        value: 384Mi
      - op: replace
        path: /spec/limits/0/max/cpu
        value: "1"
      - op: replace
        path: /spec/limits/0/max/memory
        value: 1536Mi
