# Web env from OpenBao secret/apps/govgraph/staging (ADR 0019 D6).
# Purge token is a separate Secret so web pods never see it (refresh CronJob only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: govgraph
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: govgraph
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        DATABASE_URL: "{{ .DATABASE_URL }}"
        CRON_SECRET: "{{ .CRON_SECRET }}"
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: apps/govgraph/staging
        property: DATABASE_URL
    - secretKey: CRON_SECRET
      remoteRef:
        key: apps/govgraph/staging
        property: CRON_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: govgraph-refresh
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: govgraph-refresh
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      data:
        DATABASE_URL: "{{ .DATABASE_URL }}"
        CRON_SECRET: "{{ .CRON_SECRET }}"
        CF_ZONE_ID: "{{ .CF_ZONE_ID }}"
        CF_API_TOKEN: "{{ .CF_API_TOKEN }}"
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: apps/govgraph/staging
        property: DATABASE_URL
    - secretKey: CRON_SECRET
      remoteRef:
        key: apps/govgraph/staging
        property: CRON_SECRET
    - secretKey: CF_ZONE_ID
      remoteRef:
        key: apps/govgraph/staging
        property: CF_ZONE_ID
    - secretKey: CF_API_TOKEN
      remoteRef:
        key: apps/govgraph/staging
        property: CF_API_TOKEN
