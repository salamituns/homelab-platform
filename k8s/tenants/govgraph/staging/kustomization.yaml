# Govgraph tenant staging (ADR 0019 D1, Phase 2). Shared shape (kit includes, app
# patches, ExternalSecrets) lives in ../_base; this overlay sets only the namespace,
# OpenBao role, key path and quota. OpenBao role tenant-govgraph-staging and group
# govgraph-dev are owner steps (docs/runbooks/govgraph.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: govgraph-staging
components:
  - ../_base
patches:
  - target:
      version: v1
      kind: Namespace
      name: tenant
    patch: |-
      - op: replace
        path: /metadata/name
        value: govgraph-staging
      - op: add
        path: /metadata/labels/homelab.arpa~1env
        value: staging
  - target:
      group: external-secrets.io
      version: v1
      kind: SecretStore
      name: openbao
    patch: |-
      - op: replace
        path: /spec/provider/vault/auth/kubernetes/role
        value: tenant-govgraph-staging
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: govgraph
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: apps/govgraph/staging/app
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: apps/govgraph/staging/app
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: govgraph-refresh
    # No cloudflare child in staging. Keep the app child only.
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: apps/govgraph/staging/app
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: apps/govgraph/staging/app
      - op: remove
        path: /spec/data/3
      - op: remove
        path: /spec/data/2
      - op: remove
        path: /spec/target/template/data/CF_API_TOKEN
      - op: remove
        path: /spec/target/template/data/CF_ZONE_ID
  - target:
      version: v1
      kind: ResourceQuota
      name: tenant-quota
    patch: |-
      - op: replace
        path: /spec/hard/pods
        value: "6"
      - op: replace
        path: /spec/hard/services
        value: "6"
      - op: replace
        path: /spec/hard/requests.cpu
        value: 500m
      - op: replace
        path: /spec/hard/requests.memory
        value: 768Mi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "1"
      - op: replace
        path: /spec/hard/limits.memory
        value: 2Gi
  - target:
      version: v1
      kind: LimitRange
      name: tenant-limits
    patch: |-
      - op: replace
        path: /spec/limits/0/default/cpu
        value: 250m
      - op: replace
        path: /spec/limits/0/default/memory
        value: 512Mi
      - op: replace
        path: /spec/limits/0/defaultRequest/cpu
        value: 100m
      - op: replace
        path: /spec/limits/0/defaultRequest/memory
        value: 256Mi
      - op: replace
        path: /spec/limits/0/max/cpu
        value: "1"
      - op: replace
        path: /spec/limits/0/max/memory
        value: 768Mi
