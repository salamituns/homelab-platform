# CoreDNS config, kubeadm default plus a stub domain for the lab zone (ADR 0004).
# Without the home.arpa block, CoreDNS forwards to the node's resolv.conf, which also lists the
# router; the router answers NXDOMAIN for *.home.arpa, so pod lookups fail at random.
# Apply: kubectl apply -f k8s/kube-system/coredns-configmap.yaml  (CoreDNS reloads within ~30s)
# Week 2: managed by Argo CD from this path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
    home.arpa:53 {
        errors
        cache 30
        forward . 192.168.1.96
    }
