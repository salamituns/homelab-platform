# Host names match ~/.ssh/config aliases, so Ansible reuses those HostName/User settings.
all:
  children:
    proxmox:
      hosts:
        tuns:
          ansible_user: root
    k8s:
      children:
        k8s_control:
          hosts:
            Master:
              static_ip_address: 192.168.1.90   # static_ip role
        k8s_workers:
          hosts:
            WorkerNode1:
              static_ip_address: 192.168.1.89   # static_ip role
            WorkerNode2:
              static_ip_address: 192.168.1.84   # static_ip role
    # CI platform rebuilt by Terraform (ADR 0011); replaces the hand-built JenkinsCICD/SonarQuality/Nexus.
    ci:
      hosts:
        nexus:
          ansible_host: 192.168.1.87
        sonarqube:
          ansible_host: 192.168.1.86
        jenkins:
          ansible_host: 192.168.1.88
        ci-agent:
          ansible_host: 192.168.1.93
    apps:
      hosts:
        Tomcat:
          static_ip_address: 192.168.1.85   # static_ip role
        DockerApp:
        UbuntuNew:   # Gitea server, see host_vars
    devsecops:
      hosts:
        sectools:
          ansible_host: 192.168.1.95
    network:
      hosts:
        gateway:
          ansible_host: 192.168.1.96
    platform:
      hosts:
        gitea:
          ansible_host: 192.168.1.97   # ADR 0005; replaces UbuntuNew
    backup:
      hosts:
        pbs:
          ansible_host: 192.168.1.98   # Proxmox Backup Server (Debian 13)
    # Everything Ansible baselines. Proxmox host is excluded on purpose.
    managed:
      children:
        k8s:
        ci:
        apps:
        devsecops:
        network:
        platform:
        backup:
