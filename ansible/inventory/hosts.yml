# Host names match ~/.ssh/config aliases, so Ansible reuses those HostName/User settings.
all:
  children:
    proxmox:
      hosts:
        tuns:
          ansible_user: root
    k8s:
      children:
        k8s_control:
          hosts:
            Master:
        k8s_workers:
          hosts:
            WorkerNode1:
            WorkerNode2:
    cicd:
      hosts:
        JenkinsCICD:
        SonarQuality:
        Nexus:
    apps:
      hosts:
        Tomcat:
        DockerApp:
        UbuntuNew:   # Gitea server, see host_vars
    devsecops:
      hosts:
        sectools:
          ansible_host: 192.168.1.95
    network:
      hosts:
        gateway:
          ansible_host: 192.168.1.96
    # Everything Ansible baselines. Proxmox host is excluded on purpose.
    managed:
      children:
        k8s:
        cicd:
        apps:
        devsecops:
        network:
