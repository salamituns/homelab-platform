# Nexus Repository + Docker registry (ADR 0011). Caddy (443) is the only LAN entry point.
caddy_sites:
  - { names: [nexus.home.arpa], upstream: "127.0.0.1:8081" }       # web UI and REST API
  - { names: [registry.home.arpa], upstream: "127.0.0.1:8082" }    # Docker repo `belleshop` (its connector port)

# Who may reach 443: admins, the CI agent (pushes images), the k8s nodes (pull images).
firewall_service_rules:
  - port: 443
    clients: "{{ lab_admin_clients + [
      {'name': 'ci-agent', 'ip': '192.168.1.93'},
      {'name': 'master', 'ip': '192.168.1.90'},
      {'name': 'workernode1', 'ip': '192.168.1.89'},
      {'name': 'workernode2', 'ip': '192.168.1.84'}] }}"
