# Nexus Repository + Docker registry (ADR 0011). Caddy (443) is the only LAN entry point.
caddy_sites:
  - { names: [nexus.home.arpa], upstream: "127.0.0.1:8081" }       # web UI and REST API
  # Docker repo `belleshop` (its connector port). Docker Hub official images (library/*) come from the
  # `dockerhub` proxy and Trivy DBs/checks (aquasecurity/*) from the `ghcr` proxy on the same name.
  - names: [registry.home.arpa]
    upstream: "127.0.0.1:8082"
    routes:
      - { path: "/v2/library/*", upstream: "127.0.0.1:8083" }
      - { path: "/v2/aquasecurity/*", upstream: "127.0.0.1:8084" }

# Who may reach 443: admins, the CI agent (pushes images), the k8s nodes (pull images).
firewall_service_rules:
  - port: 443
    clients: "{{ lab_admin_clients + [
      {'name': 'ci-agent', 'ip': '192.168.1.93'},
      {'name': 'master', 'ip': '192.168.1.90'},
      {'name': 'workernode1', 'ip': '192.168.1.89'},
      {'name': 'workernode2', 'ip': '192.168.1.84'}] }}"

# The owner accepted the Nexus Repository Community Edition EULA on 2026-10-29
# (https://links.sonatype.com/products/nxrm/ce-eula). The role applies it through the API.
nexus_accept_ce_eula: true
