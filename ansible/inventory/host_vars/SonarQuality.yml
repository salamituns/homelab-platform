# SonarQube runs in Docker (:9000 published): restricted in DOCKER-USER, not by ufw rules.
firewall_docker_clients: "{{ lab_admin_clients + [{'name': 'jenkins', 'ip': '192.168.1.88'}] }}"   # jenkins: scanner
firewall_delete_rules:
  - { src: 10.2.0.0/21 }
  - { port: "9000", proto: tcp }       # no effect on a Docker port; misleading, so removed
