[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = ./collections
remote_user = tunsadmin
host_key_checking = True
retry_files_enabled = False
# Run notified handlers even when a later task fails. Without it a failed first run loses its restarts for good:
# the next run sees no change, so nothing notifies again (2026-10-29: resolved never reloaded on nexus and jenkins).
force_handlers = True
callback_result_format = yaml
interpreter_python = auto_silent

[privilege_escalation]
become = True

[ssh_connection]
pipelining = True
