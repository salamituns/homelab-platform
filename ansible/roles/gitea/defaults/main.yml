# Pinned Gitea release and SHA-256 checksum for linux-amd64.
# Changing both values upgrades /usr/local/bin/gitea and restarts the service.
gitea_version: "1.27.3"
gitea_sha256: "4da93c2c10b6980c359bcb86d5573ebfd7770e2e151756534edee24c8c12d971"
gitea_download_url: "https://dl.gitea.com/gitea/{{ gitea_version }}/gitea-{{ gitea_version }}-linux-amd64"

# Canonical internal hostname and optional temporary extra SANs (e.g. during a migration).
gitea_domain: gitea.home.arpa
gitea_extra_names: []
gitea_http_port: 3000

# Initial admin account created on first boot only (password written to /root/gitea-initial-admin-password).
gitea_admin_user: tunsgit
gitea_admin_email: admin@home.arpa

# Named LAN hosts permitted to reach Caddy on 443/tcp (ADR 0005).
# Port 3000 is bound to 127.0.0.1 only and is never opened in UFW.
gitea_https_clients:
  - { name: master, ip: 192.168.1.90 }        # Argo CD pods egress from node IPs
  - { name: workernode1, ip: 192.168.1.89 }
  - { name: workernode2, ip: 192.168.1.84 }
  - { name: gateway, ip: 192.168.1.96 }       # Tailscale subnet-router SNAT address
  - { name: mac, ip: 192.168.1.121 }          # Workstation fixed DHCP allocation
  - { name: jenkins, ip: 192.168.1.88 }       # ADR 0011: branch indexing, Jenkinsfile reads
  - { name: ci-agent, ip: 192.168.1.93 }      # ADR 0011: git clone in builds

# Local dump directory and retention count for gitea-backup.timer.
gitea_backup_dir: /var/backups/gitea
gitea_backup_keep: 7

# Controller path where Caddy's local root CA certificate is fetched for client trust.
gitea_ca_fetch_dest: "{{ playbook_dir }}/../files/ca/gitea-caddy-root.crt"
