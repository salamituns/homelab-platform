# Secrets are generated directly on the host into /etc/gitea/secrets/<name> once
# and referenced via *_URI = file: in app.ini so app.ini contains no secrets and
# can be templated idempotently. umask 0027 guarantees 0640 from creation.
- name: Generate Gitea server secrets on first run
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 0027
      /usr/local/bin/gitea generate secret {{ item.type }} > {{ item.path }}
      chown root:git {{ item.path }}
      chmod 0640 {{ item.path }}
    executable: /bin/bash
    creates: "{{ item.path }}"
  loop:
    - { type: SECRET_KEY, path: /etc/gitea/secrets/secret_key }
    - { type: INTERNAL_TOKEN, path: /etc/gitea/secrets/internal_token }
    - { type: JWT_SECRET, path: /etc/gitea/secrets/jwt_secret }
    - { type: LFS_JWT_SECRET, path: /etc/gitea/secrets/lfs_jwt_secret }
  no_log: true
  notify: Restart gitea

- name: Ensure Gitea secret file ownership and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: git
    mode: "0640"
  loop:
    - /etc/gitea/secrets/secret_key
    - /etc/gitea/secrets/internal_token
    - /etc/gitea/secrets/jwt_secret
    - /etc/gitea/secrets/lfs_jwt_secret
  no_log: true
  when: not ansible_check_mode

- name: Deploy Gitea app.ini configuration
  ansible.builtin.template:
    src: app.ini.j2
    dest: /etc/gitea/app.ini
    owner: root
    group: git
    mode: "0640"
  notify: Restart gitea

- name: Deploy hardened gitea.service systemd unit
  ansible.builtin.template:
    src: gitea.service.j2
    dest: /etc/systemd/system/gitea.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart gitea

- name: Enable and start gitea service
  ansible.builtin.systemd_service:
    name: gitea
    state: started
    enabled: true
    daemon_reload: true
  # In --check on a fresh host the binary and secret files are not present yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Flush handlers so Gitea is running before health check and admin bootstrap
  ansible.builtin.meta: flush_handlers

- name: Wait for Gitea HTTP health endpoint on localhost
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitea_http_port }}/api/healthz"
    status_code: 200
  register: gitea_healthz
  until: gitea_healthz.status == 200
  retries: 30
  delay: 2
  when: not ansible_check_mode
