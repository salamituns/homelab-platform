# Make a fresh Ubuntu 24.04 VM match WorkerNode2 at the kubelet/containerd layer.
# Does not join the cluster (see playbooks/k8s-join.yml). Does not change Falco.

- name: Load overlay and br_netfilter at boot
  ansible.builtin.template:
    src: k8s-modules.conf.j2
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
  notify: Load k8s kernel modules

- name: Load overlay and br_netfilter now
  ansible.builtin.command: modprobe "{{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Kubernetes bridge and forwarding sysctl
  ansible.builtin.template:
    src: k8s-sysctl.conf.j2
    dest: /etc/sysctl.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply k8s sysctl

- name: Apply k8s sysctl now
  ansible.builtin.command: sysctl --system
  changed_when: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Turn swap off for this boot
  ansible.builtin.command: swapoff -a
  changed_when: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Keep swap off across reboots
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#]\S+\s+\S+\s+swap\s+)'
    replace: '#\1'

- name: Docker apt signing key (containerd.io lives here, not in Ubuntu)
  ansible.builtin.get_url:
    url: "{{ k8s_node_docker_apt_key_url }}"
    dest: "{{ k8s_node_docker_apt_key_dest }}"
    owner: root
    group: root
    mode: "0644"

- name: Docker official apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - amd64
    signed_by: "{{ k8s_node_docker_apt_key_dest }}"
    state: present
  register: k8s_node_docker_repo

- name: Remove a one-line Docker list if a previous install left one
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Kubernetes apt repo for v{{ k8s_node_minor }}
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "{{ k8s_node_k8s_apt_uris }}"
    suites: /
    signed_by: "{{ k8s_node_k8s_apt_key }}"
  register: k8s_node_k8s_repo

- name: Remove the hand-made one-line Kubernetes repo if present
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/kubernetes.list
    state: absent

# A repo added in this run is invisible until the cache refreshes. cache_valid_time alone skips the
# refresh when cloud-init updated apt less than an hour ago (first WorkerNode3 run, 7 Nov 2026:
# "No package matching 'containerd.io'"), so force it whenever a repo task changed.
- name: Refresh apt after adding or changing a repo
  ansible.builtin.apt:
    update_cache: true
  when: k8s_node_docker_repo is changed or k8s_node_k8s_repo is changed
  changed_when: false

- name: Install pinned containerd.io (runc 1.3.4 ships inside this package)
  ansible.builtin.apt:
    name: "{{ k8s_node_containerd_pkg }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  # In --check the repos are only pretend-added, so the package cannot be found yet.
  ignore_errors: "{{ ansible_check_mode }}"

# Own the whole main config: the package default disables the CRI plugin (disabled_plugins = ["cri"]),
# and appending an imports line would leave CRI off. backup: keeps the packaged file for comparison.
- name: Containerd main config (CRI enabled, conf.d imports)
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart containerd

- name: Containerd drop-in directory
  ansible.builtin.file:
    path: /etc/containerd/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Kubernetes CRI settings for containerd
  ansible.builtin.template:
    src: containerd-k8s.toml.j2
    dest: /etc/containerd/conf.d/10-k8s.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Enable containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install pinned kubelet kubeadm kubectl and kubernetes-cni
  ansible.builtin.apt:
    name: "{{ k8s_node_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  ignore_errors: "{{ ansible_check_mode }}"

- name: Hold kube packages and containerd.io so they cannot float
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ k8s_node_hold }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Kubelet extra args (join also writes kubeadm-flags.env)
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    owner: root
    group: root
    mode: "0644"
    content: |
      KUBELET_EXTRA_ARGS=--container-runtime-endpoint={{ k8s_node_cri_socket }}

- name: Enable kubelet (kubeadm join starts it)
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

# The Ubuntu 24.04 cloud image boots 6.8.0-88. With Ubuntu's perf_event_paranoid=4, that kernel refuses
# perf_event_open to Falco's least-privileged modern_ebpf probe (CAP_PERFMON, not CAP_SYS_ADMIN):
# "tracepoint 'syscalls/sys_enter_connect' perf_event_open() failed: Permission denied" (WorkerNode3,
# 7 Nov 2026). The current 6.8.0-1xx kernels accept CAP_PERFMON, so install the current kernel and reboot
# into it before the node joins.
- name: Current Ubuntu kernel (Falco least-privileged eBPF needs it)
  ansible.builtin.apt:
    name: linux-generic
    state: present
  ignore_errors: "{{ ansible_check_mode }}"

- name: Is a reboot pending
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: k8s_node_reboot_required

- name: Reboot into the current kernel before joining
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - k8s_node_reboot_required.stat.exists
    - not ansible_check_mode
