- name: Install Docker CE (pinned and held) and the jenkins-agent user
  ansible.builtin.import_tasks: docker.yml

- name: Install Java for the agent (the lab CAs come from the lab_ca_trust role)
  ansible.builtin.import_tasks: trust.yml

- name: Install pinned scanners into /usr/local/bin
  ansible.builtin.import_tasks: scanners.yml

- name: Install paved-road gate scripts to /opt/ci-gates
  ansible.builtin.import_tasks: gates.yml

- name: Trust the Nexus registry CA when the controller already has it
  ansible.builtin.import_tasks: registry.yml

- name: Install agent.jar, fetch the inbound secret, and start jenkins-agent
  ansible.builtin.import_tasks: agent.yml
