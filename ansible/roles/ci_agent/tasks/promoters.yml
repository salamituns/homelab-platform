# Promoter scripts (ci/promoters/*.sh), installed like the gates: root-owned in
# /opt/ci-gates so a job running as jenkins-agent can execute them but not
# rewrite them. The promoter sources the gates' lib.sh and sign.sh, so the two
# directories must land side by side as they do in the repo checkout.
- name: Require at least one promoter script on the controller
  ansible.builtin.assert:
    that:
      - lookup('fileglob', ci_agent_promoters_src ~ '/*.sh', wantlist=True) | length > 0
    fail_msg: "No ci/promoters/*.sh found at {{ ci_agent_promoters_src }}"

- name: Install promoter scripts from ci/promoters
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ci_agent_gates_dest }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ lookup('fileglob', ci_agent_promoters_src ~ '/*.sh', wantlist=True) }}"
  loop_control:
    label: "{{ item | basename }}"
