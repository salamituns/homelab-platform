- name: Download pinned crane archive verified by SHA-256
  ansible.builtin.get_url:
    url: "{{ ci_agent_crane_url }}"
    dest: "/opt/ci-scanners/go-containerregistry_{{ ci_agent_crane_version }}_Linux_x86_64.tar.gz"
    checksum: "sha256:{{ ci_agent_crane_sha256 }}"
    timeout: 120   # default 10s; GitHub release redirects often take longer (crane: read timeout, then a GitHub 504, 2026-11-09)
    owner: root
