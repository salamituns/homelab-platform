- name: Create versioned scanner directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/ci-scanners
    - "/opt/ci-scanners/trivy-{{ ci_agent_trivy_version }}"
    - "/opt/ci-scanners/syft-{{ ci_agent_syft_version }}"
    - "/opt/ci-scanners/crane-{{ ci_agent_crane_version }}"
    - "/opt/ci-scanners/gitleaks-{{ ci_agent_gitleaks_version }}"

- name: Download pinned Trivy archive verified by SHA-256
  ansible.builtin.get_url:
    url: "{{ ci_agent_trivy_url }}"
    dest: "/opt/ci-scanners/trivy_{{ ci_agent_trivy_version }}_Linux-64bit.tar.gz"
    checksum: "sha256:{{ ci_agent_trivy_sha256 }}"
    timeout: 120   # default 10s; GitHub release redirects often take longer (crane: read timeout, then a GitHub 504, 2026-11-09)
    owner: root
    group: root
    mode: "0644"
  register: ci_agent_download
  until: ci_agent_download is succeeded
  retries: 4
  delay: 15

- name: Unpack Trivy
  ansible.builtin.unarchive:
    src: "/opt/ci-scanners/trivy_{{ ci_agent_trivy_version }}_Linux-64bit.tar.gz"
    dest: "/opt/ci-scanners/trivy-{{ ci_agent_trivy_version }}"
    remote_src: true
    extra_opts:
      - --no-same-owner
    include:
      - trivy
    owner: root
    group: root
    creates: "/opt/ci-scanners/trivy-{{ ci_agent_trivy_version }}/trivy"

- name: Make the Trivy binary executable
  ansible.builtin.file:
    path: "/opt/ci-scanners/trivy-{{ ci_agent_trivy_version }}/trivy"
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode

- name: Point /usr/local/bin/trivy at the pinned version
  ansible.builtin.file:
    src: "/opt/ci-scanners/trivy-{{ ci_agent_trivy_version }}/trivy"
    dest: /usr/local/bin/trivy
    state: link
    force: true

