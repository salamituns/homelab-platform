    include:
      - crane
    owner: root
    group: root
    creates: "/opt/ci-scanners/crane-{{ ci_agent_crane_version }}/crane"
  # Check mode predicts the version dir into existence without creating it, so the
  # unarchive cannot stat its dest until the first real run (same as a fresh host).
  ignore_errors: "{{ ansible_check_mode }}"

- name: Make the crane binary executable
  ansible.builtin.file:
