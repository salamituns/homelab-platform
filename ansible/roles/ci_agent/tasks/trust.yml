# The lab CAs are installed by the lab_ca_trust role, which runs earlier in the play. This
# file only installs Java and ca-certificates-java, which keeps the JVM truststore in sync
# with the system store on every update-ca-certificates run.
- name: Install Java JRE and the package that syncs CAs into the JVM truststore
  ansible.builtin.apt:
    name:
      - "{{ ci_agent_java_package }}"
      - ca-certificates-java
    state: present
    update_cache: true
    cache_valid_time: 3600
