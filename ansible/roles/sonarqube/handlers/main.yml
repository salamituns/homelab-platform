- name: Restart postgresql
  ansible.builtin.systemd_service:
    name: postgresql
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart sonarqube
  ansible.builtin.systemd_service:
    name: sonarqube
    state: restarted
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
