- name: Create SonarQube local backup directory
  ansible.builtin.file:
    path: "{{ sonarqube_backup_dir }}"
    state: directory
    owner: sonar
    group: sonar
    mode: "0750"

- name: Deploy sonarqube-backup.service systemd unit
  ansible.builtin.template:
    src: sonarqube-backup.service.j2
    dest: /etc/systemd/system/sonarqube-backup.service
    owner: root
    group: root
    mode: "0644"

- name: Deploy sonarqube-backup.timer systemd unit
  ansible.builtin.template:
    src: sonarqube-backup.timer.j2
    dest: /etc/systemd/system/sonarqube-backup.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable and start sonarqube-backup.timer
  ansible.builtin.systemd_service:
    name: sonarqube-backup.timer
    state: started
    enabled: true
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
