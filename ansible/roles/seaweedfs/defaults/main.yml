# Pinned SeaweedFS release (ADR 0007). Bump both values together; the digest is on the GitHub
# release asset (api.github.com/repos/seaweedfs/seaweedfs/releases/tags/<version>, field "digest").
seaweedfs_version: "4.48"
seaweedfs_sha256: "4a7d108384d044d95212d1342cdda9533fa55842c1c9b41f606ca3c8a9561124"
seaweedfs_download_url: "https://github.com/seaweedfs/seaweedfs/releases/download/{{ seaweedfs_version }}/linux_amd64.tar.gz"

seaweedfs_data_dir: /var/lib/seaweedfs
# Every SeaweedFS port (master 9333, volume 8080, filer 8888, s3 8333, and their gRPC +10000) binds
# 127.0.0.1. The only way in from the LAN is Caddy on 443 (role: caddy), which terminates TLS.
seaweedfs_master_port: 9333
seaweedfs_s3_port: 8333
# How the controller reaches the store (Caddy, roles/caddy). Used by tasks/retention.yml.
seaweedfs_public_endpoint: https://s3.home.arpa
seaweedfs_ca_bundle: "{{ playbook_dir }}/../files/ca/{{ inventory_hostname }}-caddy-root.crt"   # fetched by roles/caddy
# Small volumes: the store holds state files of a few hundred KB, not media.
seaweedfs_volume_size_limit_mb: 1024
seaweedfs_volume_max: 20

# Created on the host with `weed shell`. Versioning keeps every old state file, so a bad write can be undone.
# object_lock (WORM, irreversible) + default retention: no S3 key, Terraform's included, can delete a
# version or suspend versioning until it is `retention_days` old. SeaweedFS lets plain `Write` do both
# otherwise (tested 2026-10-27, ADR 0007). GOVERNANCE: only an identity with BypassGovernanceRetention
# (none exists) could override it; COMPLIANCE would block even the owner.
seaweedfs_buckets:
  - { name: tfstate, versioning: true, object_lock: true, retention_mode: GOVERNANCE, retention_days: 30 }

# S3 identities written to /etc/seaweedfs/s3.json. Keys are read on the controller from
# ~/.aws/credentials [<profile>] (created by hand, see docs/runbooks/terraform-state.md), never from git.
# Action names: Read, Write, List, Tagging, Admin, ReadAcp, WriteAcp, DeleteBucket ...;
# "<Action>:<bucket>" limits an action to one bucket.
seaweedfs_aws_credentials_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.aws/credentials"
seaweedfs_identities:
  - name: terraform
    profile: homelab-tfstate
    # Least privilege for the state backend (role README): objects in `tfstate` only.
    # No Admin (cannot create/delete buckets or change versioning), no Tagging, no ACLs.
    actions:
      - List:tfstate    # ListObjectsV2 on init / workspace listing
      - Read:tfstate    # GetObject: state and lock info
      - Write:tfstate   # PutObject (state, If-None-Match lock) + DeleteObject (unlock)
