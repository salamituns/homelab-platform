- name: Stop cloud-init from rewriting the network config on boot
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: "network: {config: disabled}\n"
    owner: root
    group: root
    mode: "0644"

- name: Deploy static netplan config
  ansible.builtin.template:
    src: 60-static.yaml.j2
    dest: "{{ static_ip_netplan_file }}"
    owner: root
    group: root
    mode: "0600"   # netplan warns on world-readable configs
  vars:
    static_ip_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
  register: static_ip_netplan

- name: Validate the netplan config before applying it
  ansible.builtin.command: netplan generate
  changed_when: false
  when: static_ip_netplan is changed and not ansible_check_mode

# The address this SSH session uses goes away on apply, so run it detached and reconnect.
- name: Apply netplan in the background
  ansible.builtin.shell: sleep 2 && netplan apply
  async: 60
  poll: 0
  changed_when: true
  when: static_ip_netplan is changed and not ansible_check_mode

- name: Reconnect on the static address
  ansible.builtin.set_fact:
    ansible_host: "{{ static_ip_address }}"
  when: static_ip_netplan is changed and not ansible_check_mode

- name: Wait for SSH on the static address
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 120
  when: static_ip_netplan is changed and not ansible_check_mode

- name: Check the host holds only the static IPv4 address
  ansible.builtin.command: ip -4 -o addr show scope global dev {{ ansible_facts['default_ipv4']['interface'] }}
  register: static_ip_addrs
  changed_when: false
  failed_when: >-
    (static_ip_address ~ '/' ~ static_ip_prefix) not in static_ip_addrs.stdout
    or 'dynamic' in static_ip_addrs.stdout
  when: not ansible_check_mode
