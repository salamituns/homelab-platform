# Registries the k8s nodes must be able to pull from (ADR 0011). Per registry the role writes:
#   <certs_d>/<host>/ca.crt      the registry's TLS CA (Caddy's local root, fetched by the nexus role)
#   <certs_d>/<host>/hosts.toml  tells containerd's CRI plugin to use that CA for pulls
# ca_src is a path on the controller (copy src), not on the node.
# The plural name is mandated by the role brief; noqa keeps var-naming happy.
containerd_registries:  # noqa: var-naming[no-role-prefix]
  - host: registry.home.arpa
    ca_src: "{{ playbook_dir }}/../files/ca/nexus-caddy-root.crt"

# Where containerd 2.x looks for per-registry hosts.toml files. Must match the CRI registry
# config_path that the role checks (and sets if missing) in /etc/containerd/config.toml.
containerd_registry_certs_d: /etc/containerd/certs.d

# Stale per-registry dirs to delete from certs.d: leftovers from the old registry setup
# (10.2.0.11:8085 on two nodes, the port-less 10.2.0.11 variant on workernode2, checked
# 2026-10-31). No handler needed: containerd rereads certs.d on every pull ("Updates under
# this directory do not require restarting the containerd daemon", containerd docs/hosts.md).
containerd_registry_stale_dirs:
  - "10.2.0.11:8085"
  - "10.2.0.11"

# Regexes against /etc/containerd/config.toml (containerd 2.x, config version 3). The CRI v1
# images plugin's registry section is where config_path lives; its value may be a colon-separated
# list (these nodes ship '/etc/containerd/certs.d:/etc/docker/certs.d'). Kept as variables so the
# findall checks and the replace edit share one spelling of the section name.
containerd_registry_section_re: "\\[plugins\\.'io\\.containerd\\.cri\\.v1\\.images'\\.registry\\]"
containerd_registry_config_path_re: "\\[plugins\\.'io\\.containerd\\.cri\\.v1\\.images'\\.registry\\][^\\[]*?config_path\\s*=\\s*'([^']*)'"

# Section name of the transfer service, used only to undo a 2026-10-29 experiment (see tasks/main.yml).
containerd_registry_transfer_section_re: "\\[plugins\\.'io\\.containerd\\.transfer\\.v1\\.local'\\]"
