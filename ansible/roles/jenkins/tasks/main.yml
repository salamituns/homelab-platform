- name: Install Java, the Jenkins apt repo, and the pinned LTS package
  ansible.builtin.import_tasks: install.yml

- name: Install pinned plugins with jenkins-plugin-manager
  ansible.builtin.import_tasks: plugins.yml

- name: Configure JCasC, listen address, and start Jenkins
  ansible.builtin.import_tasks: config.yml

- name: Create or update the BelleShop job through the REST API
  ansible.builtin.import_tasks: job.yml
