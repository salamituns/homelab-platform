- name: Copy Gitea ci-promote token onto Jenkins
  ansible.builtin.copy:
    src: "{{ jenkins_gitea_promote_token_src }}"
    dest: /etc/jenkins/secrets/gitea-ci-promote
    owner: root
    group: jenkins
