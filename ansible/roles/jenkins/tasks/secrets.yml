    content: "{{ jenkins_sonar_token.content | b64decode }}"
    owner: root
    group: jenkins
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart jenkins
  when:
    - not ansible_check_mode
    - jenkins_has_sonarqube_token | bool

- name: Copy Cosign private key onto Jenkins
  ansible.builtin.copy:
    src: "{{ jenkins_cosign_key_src }}"
    dest: /etc/jenkins/secrets/cosign-key
    owner: root
    group: jenkins
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart jenkins
  when:
    - not ansible_check_mode
    - jenkins_has_cosign_key | bool

- name: Copy Cosign key password onto Jenkins
  ansible.builtin.copy:
    src: "{{ jenkins_cosign_password_src }}"
    dest: /etc/jenkins/secrets/cosign-password
    owner: root
    group: jenkins
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart jenkins
  when:
