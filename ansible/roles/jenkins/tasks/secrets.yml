- name: Copy Gitea Jenkins token onto Jenkins
  ansible.builtin.copy:
    src: "{{ jenkins_gitea_token_src }}"
    dest: /etc/jenkins/secrets/gitea-jenkins
    owner: root
    group: jenkins
