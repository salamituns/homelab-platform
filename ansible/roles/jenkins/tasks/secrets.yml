# The role never invents these values. It copies them onto Jenkins only when the
# source already exists, so the playbook can run before every secret is ready.

- name: Check Nexus ci-push secret on nexus
  ansible.builtin.stat:
    path: "{{ jenkins_nexus_ci_push_src }}"
  delegate_to: nexus
  register: jenkins_nexus_ci_push_stat
  ignore_errors: "{{ ansible_check_mode }}"

- name: Check Nexus ci-pull secret on nexus
  ansible.builtin.stat:
    path: "{{ jenkins_nexus_ci_pull_src }}"
  delegate_to: nexus
  register: jenkins_nexus_ci_pull_stat
  ignore_errors: "{{ ansible_check_mode }}"

- name: Check SonarQube jenkins-token on sonarqube
  ansible.builtin.stat:
    path: "{{ jenkins_sonarqube_token_src }}"
  delegate_to: sonarqube
  register: jenkins_sonar_token_stat
  ignore_errors: "{{ ansible_check_mode }}"

- name: Check Cosign key on the controller
  ansible.builtin.stat:
    path: "{{ jenkins_cosign_key_src }}"
  delegate_to: localhost
  become: false
  register: jenkins_cosign_key_stat

- name: Check Cosign password on the controller
  ansible.builtin.stat:
    path: "{{ jenkins_cosign_password_src }}"
  delegate_to: localhost
  become: false
  register: jenkins_cosign_password_stat

- name: Check Gitea Jenkins token on the controller
  ansible.builtin.stat:
    path: "{{ jenkins_gitea_token_src }}"
  delegate_to: localhost
  become: false
  register: jenkins_gitea_token_stat

- name: Check Gitea ci-promote token on the controller
  ansible.builtin.stat:
    path: "{{ jenkins_gitea_promote_token_src }}"
  delegate_to: localhost
  become: false
  register: jenkins_gitea_promote_token_stat

- name: Remember which secrets are present
  ansible.builtin.set_fact:
    jenkins_has_nexus_ci_push: "{{ (jenkins_nexus_ci_push_stat.stat | default({})).exists | default(false) }}"
    jenkins_has_nexus_ci_pull: "{{ (jenkins_nexus_ci_pull_stat.stat | default({})).exists | default(false) }}"
    jenkins_has_sonarqube_token: "{{ (jenkins_sonar_token_stat.stat | default({})).exists | default(false) }}"
    jenkins_has_cosign_key: "{{ (jenkins_cosign_key_stat.stat | default({})).exists | default(false) }}"
    jenkins_has_cosign_password: "{{ (jenkins_cosign_password_stat.stat | default({})).exists | default(false) }}"
    jenkins_has_gitea_token: "{{ (jenkins_gitea_token_stat.stat | default({})).exists | default(false) }}"
    jenkins_has_gitea_promote_token: "{{ (jenkins_gitea_promote_token_stat.stat | default({})).exists | default(false) }}"

- name: Warn about secrets that are not available yet
  ansible.builtin.debug:
    msg: "{{ item.msg }}"
  loop:
    - { have: "{{ jenkins_has_nexus_ci_push }}", msg: "Skipping nexus-ci-push: {{ jenkins_nexus_ci_push_src }} not on nexus yet" }
    - { have: "{{ jenkins_has_nexus_ci_pull }}", msg: "Skipping nexus-ci-pull: {{ jenkins_nexus_ci_pull_src }} not on nexus yet" }
    - { have: "{{ jenkins_has_sonarqube_token }}", msg: "Skipping sonarqube-token: {{ jenkins_sonarqube_token_src }} not on sonarqube yet" }
    - { have: "{{ jenkins_has_cosign_key }}", msg: "Skipping cosign-key: {{ jenkins_cosign_key_src }} not on the controller yet" }
    - { have: "{{ jenkins_has_cosign_password }}", msg: "Skipping cosign-password: {{ jenkins_cosign_password_src }} not on the controller yet" }
    - { have: "{{ jenkins_has_gitea_token }}", msg: "Skipping gitea-jenkins: {{ jenkins_gitea_token_src }} not on the controller yet" }
    - { have: "{{ jenkins_has_gitea_promote_token }}", msg: "Skipping gitea-ci-promote: {{ jenkins_gitea_promote_token_src }} not on the controller yet" }
  when: not item.have | bool
  loop_control:
    label: "{{ item.msg }}"

- name: Warn when BelleShop job is skipped because the Gitea owner is unset
  ansible.builtin.debug:
    msg: >-
      Skipping the BelleShop job: set jenkins_belleshop_owner via
      -e @../private/jenkins.yml (gitignored). Do not put the owner in git.
  when:
    - jenkins_has_gitea_token | bool
    - jenkins_belleshop_owner | length == 0

- name: Read Nexus ci-push password
  ansible.builtin.slurp:
    src: "{{ jenkins_nexus_ci_push_src }}"
  delegate_to: nexus
  register: jenkins_nexus_ci_push
  no_log: true
  when:
    - not ansible_check_mode
    - jenkins_has_nexus_ci_push | bool

- name: Write nexus-ci-push onto Jenkins
  ansible.builtin.copy:
    dest: /etc/jenkins/secrets/nexus-ci-push
    content: "{{ jenkins_nexus_ci_push.content | b64decode }}"
    owner: root
    group: jenkins
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart jenkins
  when:
    - not ansible_check_mode
    - jenkins_has_nexus_ci_push | bool

- name: Read Nexus ci-pull password
  ansible.builtin.slurp:
    src: "{{ jenkins_nexus_ci_pull_src }}"
  delegate_to: nexus
  register: jenkins_nexus_ci_pull
  no_log: true
  when:
    - not ansible_check_mode
    - jenkins_has_nexus_ci_pull | bool

- name: Write nexus-ci-pull onto Jenkins
  ansible.builtin.copy:
    dest: /etc/jenkins/secrets/nexus-ci-pull
    content: "{{ jenkins_nexus_ci_pull.content | b64decode }}"
    owner: root
    group: jenkins
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart jenkins
  when:
    - not ansible_check_mode
    - jenkins_has_nexus_ci_pull | bool

- name: Read SonarQube jenkins-token
  ansible.builtin.slurp:
    src: "{{ jenkins_sonarqube_token_src }}"
  delegate_to: sonarqube
  register: jenkins_sonar_token
  no_log: true
  when:
    - not ansible_check_mode
    - jenkins_has_sonarqube_token | bool

- name: Write sonarqube-token onto Jenkins
  ansible.builtin.copy:
