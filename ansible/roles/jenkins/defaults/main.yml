# Jenkins LTS 2.580.2 (debian-stable, 2026-10-27). Changelog:
# https://www.jenkins.io/changelog-stable/ — tested JDKs 21 and 25.
# Apt package version is exactly this string; held after install so unattended-upgrades
# cannot float the controller.
jenkins_version: "2.580.2"
jenkins_apt_key_url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
jenkins_apt_key_dest: /usr/share/keyrings/jenkins-keyring.asc
jenkins_apt_uris: https://pkg.jenkins.io/debian-stable
# Trailing slash: this repo is a path-style suite, so it has no Components field.
jenkins_apt_suites: binary/

# OpenJDK 21 is the LTS Jenkins documents for this line (fontconfig for the bundled fonts).
jenkins_java_packages:
  - openjdk-21-jre-headless
  - fontconfig

jenkins_listen_address: 127.0.0.1
jenkins_http_port: 8080
jenkins_url: https://jenkins.home.arpa/
jenkins_home: /var/lib/jenkins
jenkins_war_path: /usr/share/java/jenkins.war
jenkins_casc_dir: /var/lib/jenkins/casc
jenkins_admin_user: admin
jenkins_admin_password_file: /etc/jenkins/secrets/admin-password
jenkins_initial_admin_password_dest: /root/jenkins-initial-admin-password

# Permanent inbound node. Builds run here, never on the controller (numExecutors: 0).
jenkins_agent_name: ci-agent
jenkins_agent_label: docker
jenkins_agent_remote_fs: /var/lib/jenkins-agent
# One build at a time: ci-agent has 2 vCPUs, and two concurrent SonarScanner runs starved the JS analysis bridge
# ("Failed to start the bridge server (300s timeout)", BelleShop PR-9, 2026-10-31). Builds queue instead.
jenkins_agent_executors: 1

# plugin-installation-manager-tool 2.15.0 (GitHub release 2026-05-08).
# SHA-256 from jenkins-plugin-manager-2.15.0.jar.sha256 on that release (checked 2026-10-29).
jenkins_plugin_manager_version: "2.15.0"
jenkins_plugin_manager_sha256: "a86853ec2e2933f37a4b471ba65099b61e03c87a80c2ef8fe2315eb135672d43"
jenkins_plugin_manager_rel: https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download
jenkins_plugin_manager_jar: "jenkins-plugin-manager-{{ jenkins_plugin_manager_version }}.jar"
jenkins_plugin_manager_url: "{{ jenkins_plugin_manager_rel }}/{{ jenkins_plugin_manager_version }}/{{ jenkins_plugin_manager_jar }}"
jenkins_plugin_manager_dest: "/opt/jenkins-plugin-manager/{{ jenkins_plugin_manager_jar }}"

# Repo-root /private/ is gitignored. Extra vars file: ansible-playbook ... -e @../private/jenkins.yml
# Do not put the Gitea owner in git (the public mirror must not name people).
jenkins_belleshop_owner: ""
jenkins_belleshop_repo: BelleShop
jenkins_belleshop_script_path: Jenkinsfile
# Rendered job definitions (config.xml), applied by tasks/job.yml.
jenkins_job_dir: /etc/jenkins/jobs
jenkins_gitea_url: https://gitea.home.arpa
jenkins_sonar_url: https://sonarqube.home.arpa
jenkins_nexus_ci_push_user: ci-push
jenkins_private_dir: "{{ playbook_dir }}/../../private"

# Host paths we copy into /etc/jenkins/secrets/ (0640 root:jenkins). Missing sources are skipped.
jenkins_nexus_ci_push_src: /etc/nexus/secrets/ci-push
jenkins_sonarqube_token_src: /etc/sonarqube/secrets/jenkins-token
jenkins_cosign_key_src: "{{ jenkins_private_dir }}/cosign.key"
jenkins_cosign_password_src: "{{ jenkins_private_dir }}/cosign.password"
jenkins_gitea_token_src: "{{ jenkins_private_dir }}/gitea-jenkins.token"
# Bot that opens promotion PRs in belleshop-deploy (ADR 0012). Write on that repo only; cannot merge to main.
jenkins_gitea_promote_user: ci-promote
jenkins_gitea_promote_token_src: "{{ jenkins_private_dir }}/gitea-ci-promote.token"

