- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# Debian 12/13 (trixie) has no rsyslog or /var/log/auth.log by default; fail2ban needs
# python3-systemd and backend = systemd or fail2ban.service fails to start on sshd jail.
- name: Install python3-systemd for fail2ban journald backend on Debian
  ansible.builtin.apt:
    name: python3-systemd
    state: present
  when: ansible_facts['distribution'] == 'Debian'

- name: Configure fail2ban to use systemd journal backend on Debian
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/10-systemd-backend.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (homelab-platform, role: baseline).
      [DEFAULT]
      backend = systemd
  when: ansible_facts['distribution'] == 'Debian'

- name: Set timezone
  community.general.timezone:
    name: "{{ baseline_timezone }}"

- name: Enable baseline services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - qemu-guest-agent
    - unattended-upgrades
    - fail2ban
    - chrony
    - auditd
  # In --check the packages above are never installed, so their units don't exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

# Debian unattended-upgrades uses Origins-Pattern with label=Debian-Security rather than
# Ubuntu's Allowed-Origins "${distro_id}:${distro_codename}-security".
- name: Configure unattended-upgrades Debian-Security origin on Debian
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible (homelab-platform, role: baseline).
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
  when: ansible_facts['distribution'] == 'Debian'

- name: Cap the systemd journal
  ansible.builtin.import_tasks: journald.yml

- name: Harden SSH
  ansible.builtin.import_tasks: ssh_hardening.yml

- name: Revoke compromised SSH keys
  ansible.builtin.import_tasks: revoked_keys.yml
