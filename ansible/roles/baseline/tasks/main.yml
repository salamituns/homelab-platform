- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ baseline_timezone }}"

- name: Enable baseline services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - qemu-guest-agent
    - unattended-upgrades
    - fail2ban
    - chrony
    - auditd
  # In --check the packages above are never installed, so their units don't exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Harden SSH
  ansible.builtin.import_tasks: ssh_hardening.yml

- name: Revoke compromised SSH keys
  ansible.builtin.import_tasks: revoked_keys.yml
