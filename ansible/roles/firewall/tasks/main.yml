# NOT applied to any host yet; k8s nodes need 6443, 10250, flannel 8472/udp, NodePorts, before enabling.
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - direction: incoming
      policy: "{{ firewall_default_incoming_policy }}"
    - direction: outgoing
      policy: "{{ firewall_default_outgoing_policy }}"

- name: Allow configured TCP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ (firewall_allowed_tcp_ports + firewall_allowed_tcp_ports_extra) | unique }}"

- name: Allow configured UDP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: udp
  loop: "{{ firewall_allowed_udp_ports_extra | unique }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: "{{ firewall_logging }}"
