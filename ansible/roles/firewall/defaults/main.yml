# NOT applied to any host yet; k8s nodes need 6443, 10250, flannel 8472/udp, NodePorts, before enabling.
firewall_default_incoming_policy: deny
firewall_default_outgoing_policy: allow
firewall_logging: low

# Default TCP ports allowed on every host (SSH must always remain open).
firewall_allowed_tcp_ports:
  - 22

# Per-host or per-group extra ports to open alongside the base list.
firewall_allowed_tcp_ports_extra: []
firewall_allowed_udp_ports_extra: []
