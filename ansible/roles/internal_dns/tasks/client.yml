# Debian 13 genericcloud uses netplan + systemd-networkd, and systemd-resolved is a separate
# package that may not be installed by default. Installing it points /etc/resolv.conf at the
# 127.0.0.53 stub so the resolved.conf.d drop-in below takes effect.
- name: Install and enable systemd-resolved on Debian
  ansible.builtin.apt:
    name: systemd-resolved
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['distribution'] == 'Debian'

- name: Ensure systemd-resolved service is enabled and running on Debian
  ansible.builtin.service:
    name: systemd-resolved
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
  when: ansible_facts['distribution'] == 'Debian'

- name: Ensure systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# "~zone" is a routing-only domain: only *.home.arpa goes to the internal server.
# All other lookups keep using the host's normal DNS, so a gateway outage cannot break them.
- name: Route the internal zone to the internal DNS server
  ansible.builtin.template:
    src: resolved-homelab.conf.j2
    dest: /etc/systemd/resolved.conf.d/homelab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved
