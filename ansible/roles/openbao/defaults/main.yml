# Pinned OpenBao release (ADR 0014). Bump both together; the checksum comes from checksums.txt
# on the GitHub release page (checked 2026-10-31).
openbao_version: "2.7.2"
openbao_sha256: "582b1f3c2fdc5afd443b2d57a225ef654de75adea609fdb66731fd582a9cbc96"
openbao_download_url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_version }}/openbao_{{ openbao_version }}_linux_amd64.tar.gz"

openbao_config_dir: /etc/openbao
# Raft storage (the sealed store) and the audit log (declared in the config file, rotated weekly).
openbao_data_dir: /var/lib/openbao
openbao_log_dir: /var/log/openbao
openbao_audit_log: "{{ openbao_log_dir }}/audit.log"
# Both ports bind 127.0.0.1. The only way in from the LAN is Caddy on 443 (role: caddy),
# which terminates TLS for bao.home.arpa.
openbao_api_port: 8200
openbao_cluster_port: 8201
# What OpenBao advertises to clients (through Caddy), not what it listens on.
openbao_api_addr: "https://bao.home.arpa"
# Raft node name; a single node today, the name only matters for snapshots and future peers.
openbao_node_id: "{{ inventory_hostname }}"

# Swap is turned off on sectools: mlock is off (see the config template), so a swapped-out page
# could write secrets to the swap file, and PBS copies that disk nightly. Safe here: 3.9 GB RAM,
# ~0.6 GB used, 524 K of swap ever touched (checked 2026-10-31). Set false to keep swap.
openbao_disable_swap: true

# Break-glass root generation (docs/runbooks/openbao.md §6). OpenBao >= 2.5.3 defaults
# disable_unauthed_generate_root_endpoints to TRUE, which blocks the generate-root API
# on the listener - and the root token was revoked (2026-11-02), so generate-root is the
# only admin path left (verified live: 405 on /v1/sys/generate-root/attempt, 403 on the
# legacy /v1/sys/generate-root-token/attempt, on loopback too). False keeps those
# endpoints open on this listener, which is safe because the listener binds 127.0.0.1
# only and Caddy 403s the generate-root and rekey paths from the network (host_vars/
# sectools.yml blocked_paths), so root generation works ONLY from sectools itself.
# The flag is startup-only (no SIGHUP reload, verified 2026-11-03), so applying a change
# re-seals the store; openbao-breakglass.sh apply-config unseals with the owner's shares.
openbao_disable_generate_root_endpoints: false
