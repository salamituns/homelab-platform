# Daily etcd snapshot on the single control plane (VM 108 / Master).
# Writes /var/backups/etcd/etcd-<UTC>.db plus a 0600 tarball of pki and
# encryption-config.yaml. A snapshot without that key and PKI cannot decrypt
# secretbox Secrets. PBS still takes the whole VM; this is the application-level
# copy. Timer is 00:45 UTC so it does not overlap the 01:00-02:30 PBS window.
# node-exporter textfile collector is not enabled (live args have no
# --collector.textfile.directory); no Prometheus metric is wired. systemd
# failed units on Master are the operator signal until that collector exists.
# Usage (from ansible/):
#   ansible-playbook playbooks/k8s-etcd-backup.yml --check --diff
#   ansible-playbook playbooks/k8s-etcd-backup.yml
# Does not take a snapshot itself; the timer does. Restore drill:
#   docs/runbooks/etcd-restore-drill.md
- name: Scheduled etcd snapshots on the control plane
  hosts: k8s_control
  serial: 1
  become: true
  vars:
    etcd_backup_dir: /var/backups/etcd
    etcd_backup_keep_days: 7
    etcd_backup_oncalendar: "*-*-* 00:45:00 UTC"
  tasks:
    - name: Snapshot directory, root only (holds etcd DB and the encryption key)
      ansible.builtin.file:
        path: "{{ etcd_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install the snapshot script
      ansible.builtin.template:
        src: k8s-etcd-backup.sh.j2
        dest: /usr/local/sbin/k8s-etcd-backup.sh
        owner: root
        group: root
        mode: "0700"

    - name: Install the oneshot service
      ansible.builtin.template:
        src: k8s-etcd-backup.service.j2
        dest: /etc/systemd/system/k8s-etcd-backup.service
        owner: root
        group: root
        mode: "0644"

    - name: Install the daily timer
      ansible.builtin.template:
        src: k8s-etcd-backup.timer.j2
        dest: /etc/systemd/system/k8s-etcd-backup.timer
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start the snapshot timer
      ansible.builtin.systemd_service:
        name: k8s-etcd-backup.timer
        state: started
        enabled: true
        daemon_reload: true
      ignore_errors: "{{ ansible_check_mode }}"
