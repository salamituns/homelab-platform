# kubeadm first, alone: it is the tool that upgrades everything else. Included by k8s-upgrade.yml.
- name: Install the held kubeadm package {{ k8s_pkg_version }}
  ansible.builtin.apt:
    name: "kubeadm={{ k8s_pkg_version }}"
    allow_change_held_packages: true
  # In --check the new repo is only simulated, so apt cannot see the new version yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Hold kubeadm again
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: hold
