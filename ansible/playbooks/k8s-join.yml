# Join an apps-pool worker (ADR 0019 D2). Does not change lynis.service ExecStart.
# Usage (from ansible/):
#   ansible-playbook playbooks/k8s-join.yml --limit WorkerNode3 --check --diff
#   ansible-playbook playbooks/k8s-join.yml --limit WorkerNode3
# Hosts are k8s_apps_workers so a run without --limit cannot taint platform workers.
# Runbook: docs/runbooks/k8s-add-node.md
- name: Prepare and join an apps-pool Kubernetes worker
  hosts: k8s_apps_workers
  serial: 1
  become: true
  vars:
    k8s_join_api: "192.168.1.90:6443"
    # Minimum Ubuntu 6.8 kernel ABI for Falco least-privileged eBPF (the fleet ran 147 on 7 Nov 2026).
    k8s_join_min_kernel_abi: 147
    k8s_join_taint_key: homelab.arpa/pool
    k8s_join_taint_value: apps
    k8s_join_taint_effect: NoSchedule
    k8s_join_node_label: homelab.arpa/pool=apps
    k8s_join_config: /root/kubeadm-join.yaml
    k8s_join_approve_script: "{{ playbook_dir }}/../../scripts/approve-kubelet-serving-csrs.py"
  roles:
    - baseline
    - lab_ca_trust
    - static_ip
    - k8s_node
  tasks:
    - name: Flush k8s_node handlers so containerd is up before certs.d
      ansible.builtin.meta: flush_handlers

    - name: Trust the lab registry in containerd
      ansible.builtin.include_role:
        name: containerd_registry

    - name: Already joined this cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: k8s_join_kubelet_conf

    # Kernel for Falco, only BEFORE the first join. The Ubuntu 24.04 cloud image boots 6.8.0-88, which with
    # Ubuntu's perf_event_paranoid=4 refuses perf_event_open to Falco's least-privileged modern_ebpf probe
    # (CAP_PERFMON): Falco CrashLoopBackOff on WorkerNode3, 7 Nov 2026. Never on a joined node: rebooting a
    # worker needs cordon/drain (patch cycle), and unattended-upgrades creates reboot-required on its own.
    - name: Current kernel before the node joins
      when: not k8s_join_kubelet_conf.stat.exists
      block:
        - name: Upgrade the kernel metapackage
          ansible.builtin.apt:
            name: linux-generic
            state: latest  # noqa: package-latest
            update_cache: true
          ignore_errors: "{{ ansible_check_mode }}"

        - name: Is a reboot pending
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: k8s_join_reboot_required

        - name: Reboot into the current kernel (not joined yet, nothing to drain)
          ansible.builtin.reboot:
            reboot_timeout: 600
          when:
            - k8s_join_reboot_required.stat.exists
            - not ansible_check_mode

        - name: Refresh kernel facts after a possible reboot
          ansible.builtin.setup:
            filter: ansible_kernel

        - name: Kernel ABI is new enough for least-privileged Falco eBPF
          ansible.builtin.assert:
            that:
              - k8s_join_kernel_abi | int >= k8s_join_min_kernel_abi
            fail_msg: "Kernel {{ ansible_facts['kernel'] }} is older than ABI {{ k8s_join_min_kernel_abi }}; Falco modern_ebpf would crash-loop."
          vars:
            k8s_join_kernel_abi: "{{ ansible_facts['kernel'] | regex_search('^\\d+\\.\\d+\\.\\d+-(\\d+)', '\\1') | default(['0'], true) | first }}"
          when: not ansible_check_mode

    - name: Join with a short-lived token
      when:
        - not ansible_check_mode
        - not k8s_join_kubelet_conf.stat.exists
      block:
        - name: Create a 15-minute join token on the control plane
          ansible.builtin.command:
            argv:
              - kubeadm
              - token
              - create
              - --ttl
              - 15m
              - --print-join-command
          delegate_to: Master
          become: true
          environment:
            KUBECONFIG: /etc/kubernetes/admin.conf
          register: k8s_join_print
          changed_when: true
          no_log: true

        - name: Parse token and CA hash from the join command
          ansible.builtin.set_fact:
            # regex_search with a capture-group argument returns a LIST; `first` makes it the string.
            # Without it the JoinConfiguration got token: "['…']" and discovery failed (7 Nov 2026).
            k8s_join_token: "{{ k8s_join_print.stdout | regex_search('--token\\s+(\\S+)', '\\1') | default([''], true) | first }}"
            k8s_join_ca_hash: "{{ k8s_join_print.stdout | regex_search('--discovery-token-ca-cert-hash\\s+(\\S+)', '\\1') | default([''], true) | first }}"
          no_log: true

        - name: The join command parsed into a token and a CA hash
          ansible.builtin.assert:
            that:
              - k8s_join_token | length > 0
              - k8s_join_ca_hash is match('sha256:')
            fail_msg: "Could not parse kubeadm print-join-command output (format change?). Token not shown."
            quiet: true
          no_log: true

        - name: Write a 0600 JoinConfiguration on the new node
          ansible.builtin.template:
            src: k8s-join.yaml.j2
            dest: "{{ k8s_join_config }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Join the cluster with the apps-pool taint and label
          ansible.builtin.command:
            argv:
              - kubeadm
              - join
              - --config
              - "{{ k8s_join_config }}"
          register: k8s_join_result
          changed_when: true
          failed_when: false
          no_log: true

        # no_log hides the token but also hid the error on the first run. Show kubeadm's output with the
        # bootstrap token redacted, then fail.
        - name: Fail with kubeadm's output (token redacted) if the join failed
          ansible.builtin.fail:
            msg: >-
              {{ ((k8s_join_result.stdout | default('')) ~ '\n' ~ (k8s_join_result.stderr | default('')))
                 | replace(k8s_join_token, '<redacted-token>')
                 | regex_replace('[a-z0-9]{6}\\.[a-z0-9]{16}', '<redacted-token>') }}
          when: k8s_join_result.rc | default(0) != 0
      always:
        - name: Remove the join configuration
          ansible.builtin.file:
            path: "{{ k8s_join_config }}"
            state: absent
          when: not ansible_check_mode

    - name: Wait until the API server lists this node
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - get
          - node
          - "{{ inventory_hostname | lower }}"
      delegate_to: Master
      become: true
      register: k8s_join_node
      retries: 30
      delay: 5
      until: k8s_join_node.rc == 0
      changed_when: false
      when: not ansible_check_mode

    - name: Wait for the kubelet to request a serving certificate
      ansible.builtin.pause:
        seconds: 20
      when: not ansible_check_mode

    # Runs ON Master with admin.conf: approving CSRs needs cluster-admin, and the Mac's daily kubectl
    # cert is deliberately least-privilege (first WorkerNode3 run, 7 Nov 2026, failed on the Mac).
    # The script module copies the repo script over and runs it there; it still checks name + IP.
    - name: Approve kubelet-serving CSRs for the new node
      ansible.builtin.script:
        cmd: "{{ k8s_join_approve_script | quote }}{{ ' --dry-run' if ansible_check_mode else '' }}"
        executable: python3
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: Master
      become: true
      changed_when: false
      check_mode: false

    - name: Wait for the kubelet serving certificate on disk
      ansible.builtin.stat:
        path: /var/lib/kubelet/pki/kubelet-server-current.pem
      register: k8s_join_serving_pem
      retries: 18
      delay: 10
      until: k8s_join_serving_pem.stat.exists | default(false)
      when: not ansible_check_mode

    - name: Manage Lynis on the new node
      ansible.builtin.include_role:
        name: lynis
