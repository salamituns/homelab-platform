# Shift-left: these run on every `git commit`. Install once with `pre-commit install`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
      - id: terraform_trivy
  # Local hook: runs inside ansible/ so it honors ansible.cfg (roles_path, collections_path).
  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        entry: bash -c 'cd ansible && ansible-lint'
        language: system
        pass_filenames: false
        files: ^ansible/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]   # Kubernetes manifests hold many documents
      # Vendored upstream manifests stay byte-for-byte (SHA-256 in k8s/platform/VENDOR.md).
      - id: end-of-file-fixer
        exclude: ^k8s/platform/.*/vendor/
      - id: trailing-whitespace
        exclude: ^k8s/platform/.*/vendor/
      - id: detect-private-key
